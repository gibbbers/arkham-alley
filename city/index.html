<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>ALLEY — cinematic Three.js demo</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; }
  body { font-family: "Helvetica Neue", Inter, system-ui, sans-serif; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* cinematic letterbox */
  .bar { position:fixed; left:0; right:0; height:7vh; background:#000; z-index:20; pointer-events:none; }
  .bar.top { top:0; } .bar.bot { bottom:0; }

  #fade { position:fixed; inset:0; background:#000; z-index:19; pointer-events:none; opacity:1;
          transition:none; }

  #title { position:fixed; z-index:21; left:0; right:0; bottom:11vh; text-align:center; pointer-events:none;
           color:#cfd6e4; letter-spacing:.62em; font-size:11px; font-weight:600; text-transform:uppercase;
           text-shadow:0 0 18px rgba(0,0,0,.9); opacity:0; transition:opacity 1.2s ease; }
  #title small { display:block; letter-spacing:.22em; font-size:9px; font-weight:400; opacity:.5; margin-top:9px; }

  #stats { position:fixed; z-index:21; right:12px; top:calc(7vh + 10px); font-size:10px; letter-spacing:.14em;
           color:rgba(160,175,200,.35); font-variant-numeric:tabular-nums; pointer-events:none; }

  #loader { position:fixed; inset:0; z-index:40; background:#000; display:flex; align-items:center;
            justify-content:center; flex-direction:column; gap:16px; transition:opacity .8s ease; }
  #loader.done { opacity:0; pointer-events:none; }
  #loader .t { color:#7d8798; font-size:11px; letter-spacing:.5em; text-transform:uppercase; }
  #loader .b { width:180px; height:1px; background:rgba(255,255,255,.12); overflow:hidden; }
  #loader .b i { display:block; height:100%; width:30%; background:#8fa6c8;
                 animation:sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0%{transform:translateX(-100%)} 100%{transform:translateX(340%)} }
  #err { position:fixed; inset:0; z-index:50; display:none; padding:40px; color:#e88; font:12px/1.6 monospace;
         background:#000; white-space:pre-wrap; overflow:auto; }

  /* ---- cinematic caption box ---- */
  #cap { position:fixed; z-index:24; left:50%; transform:translateX(-50%) translateY(6px);
         bottom:calc(7vh + 34px); width:min(62ch, 78vw); pointer-events:none;
         opacity:0; transition:opacity .38s ease, transform .38s ease; }
  #cap.on { opacity:1; transform:translateX(-50%) translateY(0); }
  #cap .box { background:linear-gradient(180deg, rgba(8,10,15,.80), rgba(6,7,11,.90));
              border:1px solid rgba(150,175,215,.16); border-left:2px solid var(--who,#7f93b8);
              border-radius:3px; padding:11px 18px 13px; backdrop-filter:blur(7px);
              box-shadow:0 10px 34px rgba(0,0,0,.55); }
  #cap .who { font-size:9.5px; letter-spacing:.34em; font-weight:700; text-transform:uppercase;
              color:var(--who,#7f93b8); margin-bottom:6px; opacity:.92; }
  #cap .txt { font-size:clamp(13px,1.45vw,17px); line-height:1.5; color:#e7ecf5; font-weight:400;
              text-shadow:0 1px 10px rgba(0,0,0,.8); }

  /* ---- sound control ---- */
  #snd { position:fixed; z-index:25; right:14px; bottom:calc(7vh + 12px); display:flex; align-items:center;
         gap:8px; opacity:.42; transition:opacity .25s ease; }
  #snd:hover { opacity:1; }
  #snd button { width:26px; height:26px; border:1px solid rgba(160,180,215,.28); border-radius:3px;
                background:rgba(8,10,15,.6); color:#c3cede; cursor:pointer; font-size:12px; line-height:1;
                display:flex; align-items:center; justify-content:center; padding:0; }
  #snd input { width:0; opacity:0; transition:width .25s ease, opacity .25s ease; accent-color:#8fa6c8; }
  #snd:hover input { width:74px; opacity:1; }

  /* ---- click-to-begin gate ---- */
  #start { position:fixed; inset:0; z-index:35; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:14px; cursor:pointer; background:rgba(2,3,6,.62);
           backdrop-filter:blur(2px); transition:opacity .55s ease; }
  #start.gone { opacity:0; pointer-events:none; }
  #start .t { color:#dbe3f0; font-size:13px; letter-spacing:.62em; text-transform:uppercase; font-weight:600; }
  #start .s { color:#8794a8; font-size:10.5px; letter-spacing:.26em; text-transform:uppercase; }
  #start .r { width:44px; height:44px; border:1px solid rgba(180,200,235,.35); border-radius:50%;
              display:flex; align-items:center; justify-content:center; color:#cfd8e8; font-size:13px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar top"></div><div class="bar bot"></div>
<div id="fade"></div>
<div id="title">Alley<small>three.js — procedural cinematic test</small></div>
<div id="stats"></div>
<div id="cap"><div class="box"><div class="who"></div><div class="txt"></div></div></div>
<div id="snd"><input id="vol" type="range" min="0" max="100" value="75" /><button id="mute" title="mute">&#9834;</button></div>
<div id="start"><div class="r">&#9654;</div><div class="t">Alley</div><div class="s">click to begin &middot; with sound</div></div>
<div id="loader"><div class="t">Building scene</div><div class="b"><i></i></div></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';

const T_BOOT = performance.now();

/* ══════════════════════════════════════════════════════════════════════════
   0. small math / noise helpers  (all textures below are generated at runtime)
   ══════════════════════════════════════════════════════════════════════════ */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const smooth= t => t*t*(3-2*t);
const smoothstep = (e0,e1,x)=>{ const t = clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
const easeInOut = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOut   = t => 1-Math.pow(1-t,3);
const rand = (() => { let s = 1337; return () => (s = (s*1664525+1013904223)>>>0) / 4294967296; })();
const rr = (a,b)=> a + rand()*(b-a);

// tileable value noise --------------------------------------------------------
function hashT(x,y,p){                    // integer hash — no trig, ~5x faster
  x = ((x%p)+p)%p; y = ((y%p)+p)%p;
  let n = (Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177) | 0;
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x,y,p){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=smooth(xf), v=smooth(yf);
  const a=hashT(xi,yi,p),   b=hashT(xi+1,yi,p);
  const c=hashT(xi,yi+1,p), d=hashT(xi+1,yi+1,p);
  return lerp(lerp(a,b,u), lerp(c,d,u), v);
}
function fbm(x,y,oct,period){
  let s=0,a=0.5,f=1,n=0;
  for(let i=0;i<oct;i++){ s += a*vnoise(x*f,y*f,period*f); n+=a; f*=2; a*=0.5; }
  return s/n;
}

const cv = (w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
function texFrom(canvas, repX=1, repY=1, srgb=false){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX, repY);
  t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
/* derive a normal map from a greyscale height canvas (sobel) */
function normalMapFrom(heightCanvas, strength=2.2){
  const w=heightCanvas.width, h=heightCanvas.height;
  const src = heightCanvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
  const out = cv(w,h); const ctx = out.getContext('2d',{willReadFrequently:true});
  const img = ctx.createImageData(w,h); const d = img.data;
  // single-channel copy so the sobel loop is a flat typed-array read
  const H = new Float32Array(w*h);
  for(let i=0,n=w*h;i<n;i++) H[i] = src[i*4]*(1/255);
  const xm=new Int32Array(w), xp=new Int32Array(w);
  for(let x=0;x<w;x++){ xm[x]=(x-1+w)%w; xp[x]=(x+1)%w; }
  for(let y=0;y<h;y++){
    const rowT=((y-1+h)%h)*w, rowC=y*w, rowB=((y+1)%h)*w;
    for(let x=0;x<w;x++){
      const a=xm[x], c=xp[x];
      const tl=H[rowT+a], t=H[rowT+x], tr=H[rowT+c];
      const l =H[rowC+a],              r =H[rowC+c];
      const bl=H[rowB+a], b=H[rowB+x], br=H[rowB+c];
      const dx = (tr+2*r+br)-(tl+2*l+bl);
      const dy = (bl+2*b+br)-(tl+2*t+tr);
      let nx=-dx*strength, ny=-dy*strength, nz=1;
      const il = 1/Math.sqrt(nx*nx+ny*ny+1); nx*=il; ny*=il; nz=il;
      const i=(rowC+x)*4;
      d[i]=(nx*0.5+0.5)*255; d[i+1]=(ny*0.5+0.5)*255; d[i+2]=(nz*0.5+0.5)*255; d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   1. procedural material library
   ══════════════════════════════════════════════════════════════════════════ */
const MAT = {};

/* --- grime / streak overlay applied per-pixel to an albedo canvas --------- */
function grimePass(canvas, {dark=0.55, streaks=0.5, scale=3, seedOff=0}={}){
  const w=canvas.width,h=canvas.height,c=canvas.getContext('2d',{willReadFrequently:true});
  const img=c.getImageData(0,0,w,h), d=img.data;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const u=x/w, v=y/h;
      const n  = fbm(u*scale+seedOff, v*scale, 4, scale);
      const st = fbm(u*scale*6+seedOff, v*scale*0.35, 3, scale*6);
      let m = 1 - dark*Math.pow(clamp(n,0,1),1.6);
      m *= 1 - streaks*Math.pow(clamp(st,0,1),3.0);
      const i=(y*w+x)*4;
      d[i]*=m; d[i+1]*=m*0.99; d[i+2]*=m*0.97;
    }
  }
  c.putImageData(img,0,0);
  return canvas;
}

/* --- BRICK ---------------------------------------------------------------- */
function makeBrick(size=1024, tint=[0.42,0.26,0.22]){
  const alb=cv(size,size), hgt=cv(size,size), rgh=cv(size,size);
  const a=alb.getContext('2d',{willReadFrequently:true}), g=hgt.getContext('2d',{willReadFrequently:true}), r=rgh.getContext('2d',{willReadFrequently:true});
  a.fillStyle='#2b2622'; a.fillRect(0,0,size,size);
  g.fillStyle='#2e2e2e'; g.fillRect(0,0,size,size);
  r.fillStyle='#e0e0e0'; r.fillRect(0,0,size,size);
  const rows=14, cols=6, bh=size/rows, bw=size/cols, m=Math.max(2,size/220);
  for(let row=0; row<rows; row++){
    const off=(row%2)? bw*0.5 : 0;
    for(let i=-1;i<=cols;i++){
      const x=i*bw+off+m, y=row*bh+m, w=bw-m*2, hh=bh-m*2;
      const j = 0.75 + rand()*0.5;
      const rc=Math.floor(255*tint[0]*j), gc=Math.floor(255*tint[1]*j), bc=Math.floor(255*tint[2]*j);
      a.fillStyle=`rgb(${rc},${gc},${bc})`; a.fillRect(x,y,w,hh);
      const hv=Math.floor(150+rand()*70);
      g.fillStyle=`rgb(${hv},${hv},${hv})`; g.fillRect(x,y,w,hh);
      const rv=Math.floor(190+rand()*50);
      r.fillStyle=`rgb(${rv},${rv},${rv})`; r.fillRect(x,y,w,hh);
      // chipped corners
      if(rand()<0.18){
        a.fillStyle='rgba(40,34,30,0.85)';
        a.fillRect(x+rand()*w*0.7, y+rand()*hh*0.6, w*0.25, hh*0.3);
      }
    }
  }
  // speckle
  const img=a.getImageData(0,0,size,size), d=img.data;
  for(let i=0;i<d.length;i+=4){ const s=(rand()-0.5)*26; d[i]+=s; d[i+1]+=s; d[i+2]+=s; }
  a.putImageData(img,0,0);
  grimePass(alb,{dark:0.62, streaks:0.55, scale:3, seedOff:11});
  return { map:texFrom(alb,1,1,true), normalMap:texFrom(normalMapFrom(hgt,2.6)), roughnessMap:texFrom(rgh) };
}

/* --- CONCRETE ------------------------------------------------------------- */
function makeConcrete(size=1024, base=[0.30,0.31,0.34]){
  const alb=cv(size,size), hgt=cv(size,size), rgh=cv(size,size);
  const a=alb.getContext('2d',{willReadFrequently:true}), g=hgt.getContext('2d',{willReadFrequently:true}), r=rgh.getContext('2d',{willReadFrequently:true});
  const ai=a.createImageData(size,size), gi=g.createImageData(size,size), ri=r.createImageData(size,size);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const u=x/size, v=y/size;
    const n = fbm(u*5,v*5,4,5);
    const fine = fbm(u*40,v*40,2,40);
    const mott = 0.72 + n*0.5 + (fine-0.5)*0.22;
    const i=(y*size+x)*4;
    ai.data[i]  =clamp(base[0]*mott,0,1)*255;
    ai.data[i+1]=clamp(base[1]*mott,0,1)*255;
    ai.data[i+2]=clamp(base[2]*mott,0,1)*255;
    ai.data[i+3]=255;
    const hv=(0.4+n*0.45+(fine-0.5)*0.25)*255;
    gi.data[i]=gi.data[i+1]=gi.data[i+2]=hv; gi.data[i+3]=255;
    const rv=(0.72+n*0.24)*255;
    ri.data[i]=ri.data[i+1]=ri.data[i+2]=rv; ri.data[i+3]=255;
  }
  a.putImageData(ai,0,0); g.putImageData(gi,0,0); r.putImageData(ri,0,0);
  // cracks
  a.strokeStyle='rgba(18,18,20,0.75)'; g.strokeStyle='rgba(20,20,20,1)';
  for(let k=0;k<9;k++){
    let x=rand()*size, y=rand()*size, ang=rand()*6.28;
    a.beginPath(); g.beginPath(); a.moveTo(x,y); g.moveTo(x,y);
    a.lineWidth=g.lineWidth=rr(0.8,2.2);
    for(let s=0;s<26;s++){ ang+=rr(-0.6,0.6); x+=Math.cos(ang)*size*0.02; y+=Math.sin(ang)*size*0.02;
      a.lineTo(x,y); g.lineTo(x,y); }
    a.stroke(); g.stroke();
  }
  grimePass(alb,{dark:0.5,streaks:0.6,scale:2.5,seedOff:31});
  return { map:texFrom(alb,1,1,true), normalMap:texFrom(normalMapFrom(hgt,1.6)), roughnessMap:texFrom(rgh) };
}

/* --- WET ASPHALT + PUDDLES (albedo / rough / normal / alpha share one tile) */
function makeAsphalt(size=1024){
  const alb=cv(size,size), hgt=cv(size,size), rgh=cv(size,size), alp=cv(size,size);
  const a=alb.getContext('2d',{willReadFrequently:true}), g=hgt.getContext('2d',{willReadFrequently:true}), r=rgh.getContext('2d',{willReadFrequently:true}), p=alp.getContext('2d',{willReadFrequently:true});
  const ai=a.createImageData(size,size), gi=g.createImageData(size,size),
        ri=r.createImageData(size,size), pi=p.createImageData(size,size);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const u=x/size, v=y/size;
    const grain  = fbm(u*70,v*70,2,70);
    const gravel = fbm(u*26,v*26,3,26);
    const broad  = fbm(u*3.2+5.5, v*3.2+2.5, 4, 3.2);
    // puddle field: low areas of the broad noise hold water
    const pud = smoothstep(0.50, 0.36, broad) * smoothstep(0.02,0.10, fbm(u*7,v*7,2,7));
    const wet = clamp(pud,0,1);
    const lum = 0.055 + gravel*0.075 + (grain-0.5)*0.05;
    const i=(y*size+x)*4;
    const dark = lerp(1.0, 0.42, wet);
    ai.data[i]  =clamp(lum*dark*1.00,0,1)*255;
    ai.data[i+1]=clamp(lum*dark*1.03,0,1)*255;
    ai.data[i+2]=clamp(lum*dark*1.12,0,1)*255;
    ai.data[i+3]=255;
    const hv = clamp(lerp(0.35+gravel*0.5+(grain-0.5)*0.35, 0.12, wet),0,1)*255;
    gi.data[i]=gi.data[i+1]=gi.data[i+2]=hv; gi.data[i+3]=255;
    // wet road: fairly glossy everywhere, mirror-smooth inside puddles
    const rv = clamp(lerp(0.44+gravel*0.30, 0.07, wet),0,1)*255;
    ri.data[i]=ri.data[i+1]=ri.data[i+2]=rv; ri.data[i+3]=255;
    // alpha for the asphalt sheet laid over the mirror: holes = puddles
    const av = clamp(1.0 - smoothstep(0.18,0.72,wet),0,1)*255;
    pi.data[i]=pi.data[i+1]=pi.data[i+2]=av; pi.data[i+3]=255;
  }
  a.putImageData(ai,0,0); g.putImageData(gi,0,0); r.putImageData(ri,0,0); p.putImageData(pi,0,0);
  return {
    map:texFrom(alb,1,1,true), normalMap:texFrom(normalMapFrom(hgt,1.15)),
    roughnessMap:texFrom(rgh),  alphaMap:texFrom(alp)
  };
}

/* --- worn painted metal --------------------------------------------------- */
function makeMetal(size=384, base='#2f3a3a'){
  const alb=cv(size,size), rgh=cv(size,size), hgt=cv(size,size);
  const a=alb.getContext('2d',{willReadFrequently:true}), r=rgh.getContext('2d',{willReadFrequently:true}), g=hgt.getContext('2d',{willReadFrequently:true});
  a.fillStyle=base; a.fillRect(0,0,size,size);
  r.fillStyle='#7a7a7a'; r.fillRect(0,0,size,size);
  g.fillStyle='#808080'; g.fillRect(0,0,size,size);
  // rust patches
  for(let k=0;k<70;k++){
    const x=rand()*size,y=rand()*size,rad=rr(4,42);
    const grd=a.createRadialGradient(x,y,0,x,y,rad);
    const o=rr(.15,.5);
    grd.addColorStop(0,`rgba(${90+rand()*60|0},${45+rand()*30|0},22,${o})`);
    grd.addColorStop(1,'rgba(80,40,20,0)');
    a.fillStyle=grd; a.beginPath(); a.arc(x,y,rad,0,6.283); a.fill();
    const gr=r.createRadialGradient(x,y,0,x,y,rad);
    gr.addColorStop(0,`rgba(255,255,255,${o})`); gr.addColorStop(1,'rgba(255,255,255,0)');
    r.fillStyle=gr; r.beginPath(); r.arc(x,y,rad,0,6.283); r.fill();
  }
  // scratches
  for(let k=0;k<160;k++){
    const x=rand()*size,y=rand()*size,l=rr(6,60),ang=rr(0,6.283);
    a.strokeStyle=`rgba(255,255,255,${rr(.02,.10)})`; a.lineWidth=rr(.5,1.6);
    a.beginPath(); a.moveTo(x,y); a.lineTo(x+Math.cos(ang)*l,y+Math.sin(ang)*l); a.stroke();
    r.strokeStyle=`rgba(60,60,60,${rr(.1,.35)})`; r.lineWidth=a.lineWidth;
    r.beginPath(); r.moveTo(x,y); r.lineTo(x+Math.cos(ang)*l,y+Math.sin(ang)*l); r.stroke();
  }
  grimePass(alb,{dark:0.45,streaks:0.45,scale:2,seedOff:7});
  // dents
  const gi=g.getImageData(0,0,size,size);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const n=fbm(x/size*6,y/size*6,3,6); const i=(y*size+x)*4;
    gi.data[i]=gi.data[i+1]=gi.data[i+2]=(0.35+n*0.5)*255;
  }
  g.putImageData(gi,0,0);
  return { map:texFrom(alb,1,1,true), roughnessMap:texFrom(rgh), normalMap:texFrom(normalMapFrom(hgt,1.1)) };
}

/* --- graffiti decal (transparent) ---------------------------------------- */
function makeGraffiti(w=512,h=256){
  const c=cv(w,h), x=c.getContext('2d',{willReadFrequently:true});
  x.clearRect(0,0,w,h);
  const palettes=[['#e0356b','#ff7a18','#ffd166'],['#25d0c0','#3a86ff','#b5179e'],['#a8ff3e','#f7f7f7','#ff006e']];
  const pal=palettes[Math.floor(rand()*palettes.length)];
  x.lineCap='round'; x.lineJoin='round';
  for(let s=0;s<7;s++){
    x.strokeStyle=pal[Math.floor(rand()*pal.length)];
    x.globalAlpha=rr(.55,.95);
    x.lineWidth=rr(10,30);
    x.beginPath();
    let px=rr(w*0.05,w*0.35), py=rr(h*0.25,h*0.8);
    x.moveTo(px,py);
    for(let k=0;k<5;k++){
      const cx=px+rr(20,140), cy=py+rr(-120,120);
      const nx=cx+rr(20,120), ny=rr(h*0.15,h*0.85);
      x.quadraticCurveTo(cx,cy,nx,ny); px=nx; py=ny;
      if(px>w*0.92) break;
    }
    x.stroke();
  }
  // outline pass
  x.globalAlpha=.8; x.strokeStyle='#0d0d10'; x.lineWidth=3;
  for(let s=0;s<12;s++){
    x.beginPath();
    x.moveTo(rr(0,w),rr(0,h));
    x.lineTo(rr(0,w),rr(0,h));
    x.stroke();
  }
  x.globalAlpha=1;
  // spatter
  for(let k=0;k<220;k++){
    x.fillStyle=pal[Math.floor(rand()*pal.length)];
    x.globalAlpha=rr(.1,.5);
    x.beginPath(); x.arc(rr(0,w),rr(0,h),rr(.6,3),0,6.283); x.fill();
  }
  x.globalAlpha=1;
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}

/* --- soft particle sprites ------------------------------------------------ */
function makeSmokeTex(size=192){
  const c=cv(size,size), x=c.getContext('2d',{willReadFrequently:true});
  const img=x.createImageData(size,size);
  for(let y=0;y<size;y++) for(let px=0;px<size;px++){
    const u=px/size-0.5, v=y/size-0.5;
    const d=Math.hypot(u,v)*2;
    const n=fbm(px/size*4.5, y/size*4.5, 4, 4.5);
    let al=clamp(1-d,0,1); al=Math.pow(al,1.9)*clamp(n*1.6,0,1);
    const i=(y*size+px)*4;
    img.data[i]=img.data[i+1]=img.data[i+2]=255;
    img.data[i+3]=al*255;
  }
  x.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
function makeGlowTex(size=128, pow=2.6){
  const c=cv(size,size), x=c.getContext('2d',{willReadFrequently:true});
  const g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(let i=0;i<=10;i++){ const t=i/10; g.addColorStop(t, `rgba(255,255,255,${Math.pow(1-t,pow)})`); }
  x.fillStyle=g; x.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
/* rg noise used to ripple the puddle mirror */
function makeRippleTex(size=256){
  const c=cv(size,size), x=c.getContext('2d',{willReadFrequently:true});
  const img=x.createImageData(size,size);
  for(let y=0;y<size;y++) for(let px=0;px<size;px++){
    const i=(y*size+px)*4;
    img.data[i]  = fbm(px/size*4, y/size*4, 4, 4)*255;
    img.data[i+1]= fbm(px/size*4+13.7, y/size*4+7.1, 4, 4)*255;
    img.data[i+2]=128; img.data[i+3]=255;
  }
  x.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}

/* --- procedural "HDRI": dark sky + city glow blobs ------------------------ */
function buildEnvironment(){
  const w=1024,h=512,c=cv(w,h),x=c.getContext('2d',{willReadFrequently:true});
  const grd=x.createLinearGradient(0,0,0,h);
  grd.addColorStop(0.00,'#05070f');
  grd.addColorStop(0.42,'#101a30');
  grd.addColorStop(0.52,'#2a3350');
  grd.addColorStop(0.62,'#171d2c');
  grd.addColorStop(1.00,'#050609');
  x.fillStyle=grd; x.fillRect(0,0,w,h);
  const blob=(cx,cy,r,col,al)=>{
    const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,col.replace('ALPHA',al)); g.addColorStop(1,col.replace('ALPHA','0'));
    x.fillStyle=g; x.beginPath(); x.arc(cx,cy,r,0,6.283); x.fill();
  };
  blob(w*0.18,h*0.56,240,'rgba(255,120,40,ALPHA)',0.55);   // sodium city glow
  blob(w*0.62,h*0.52,300,'rgba(60,110,255,ALPHA)',0.5);    // cold moon side
  blob(w*0.82,h*0.60,200,'rgba(210,40,150,ALPHA)',0.35);   // distant neon
  blob(w*0.42,h*0.30,180,'rgba(120,150,220,ALPHA)',0.25);
  // faint window grid on the "buildings" band
  x.globalAlpha=0.5;
  for(let i=0;i<900;i++){
    const px=rand()*w, py=h*0.55+rand()*h*0.35;
    x.fillStyle= rand()<0.75 ? 'rgba(255,196,120,0.5)' : 'rgba(150,190,255,0.45)';
    x.fillRect(px,py,rr(1,3),rr(1,3));
  }
  x.globalAlpha=1;
  const tex=new THREE.CanvasTexture(c);
  tex.mapping=THREE.EquirectangularReflectionMapping;
  tex.colorSpace=THREE.SRGBColorSpace;
  const pmrem=new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const env=pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
  return env;
}
scene.environment = buildEnvironment();

function cloneSet(set, rx, ry){
  const o={};
  for(const k in set){
    const t=set[k].clone(); t.needsUpdate=true;
    t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry);
    o[k]=t;
  }
  return o;
}

    uniforms:{ top:{value:new THREE.Color(0x04060c)}, mid:{value:new THREE.Color(0x141d33)},
               hor:{value:new THREE.Color(0x3a2a30)} },
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`
      uniform vec3 top,mid,hor; varying vec3 vP;
      void main(){
        float h = clamp(normalize(vP).y*0.5+0.5, 0.0, 1.0);
        vec3 c = mix(hor, mid, smoothstep(0.46,0.62,h));
        c = mix(c, top, smoothstep(0.60,0.95,h));
        gl_FragColor = vec4(c,1.0);
      }`
  })
);

/* --- mirror layer --------------------------------------------------------- */
const RippleReflectorShader = {
  uniforms: Object.assign({}, THREE.UniformsLib.fog, {
    color:{value:null}, tDiffuse:{value:null}, textureMatrix:{value:null},
    uTime:{value:0}, tNoise:{value:null}, uGain:{value:1.35}
  }),
  vertexShader:`
    uniform mat4 textureMatrix;
    varying vec4 vProj; varying vec2 vUvL;
    #include <fog_pars_vertex>
    void main(){
      vUvL = uv;
      vProj = textureMatrix * vec4(position,1.0);
      vec4 mvPosition = modelViewMatrix * vec4(position,1.0);
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader:`
    uniform vec3 color; uniform sampler2D tDiffuse; uniform sampler2D tNoise;
    uniform float uTime, uGain;
    varying vec4 vProj; varying vec2 vUvL;
    #include <fog_pars_fragment>
    void main(){
      vec2 n1 = texture2D(tNoise, vUvL*vec2(7.0,22.0) + vec2(uTime*0.010, uTime*0.021)).rg;
      vec2 n2 = texture2D(tNoise, vUvL*vec2(13.0,41.0) - vec2(uTime*0.017, uTime*0.011)).rg;
      vec2 d  = ((n1-0.5)+(n2-0.5));
      vec4 p  = vProj;
      p.xy   += d * 0.016 * p.w;
      vec3 refl = texture2DProj(tDiffuse, p).rgb;
      refl = pow(refl, vec3(1.12)) * uGain * color;
      gl_FragColor = vec4(refl, 1.0);
      #include <fog_fragment>
    }`
};
const mirror = new Reflector(new THREE.PlaneGeometry(2*ALLEY_HW+1.0, Z_NEAR-Z_FAR), {
  textureWidth: QUALITY.mirror, textureHeight: QUALITY.mirror,
  color: 0x9aa4b4, clipBias: 0.004, shader: RippleReflectorShader
});
mirror.material.fog = true;
mirror.material.uniforms.tNoise.value = TEX.ripple;

mirror.position.set(0, GROUND_Y, (Z_NEAR+Z_FAR)/2);

});

/* keep the asphalt sheet out of its own reflection */
const _mirrorOBR = mirror.onBeforeRender;
let _frameId = 0, _mirrorFrame = -1;
const bumpFrame = ()=> _frameId++;
mirror.onBeforeRender = function(r,s,c){
  if(_mirrorFrame === _frameId) return;   // one mirror update per frame, not per pass
  _mirrorFrame = _frameId;
  if(_frameId & 1) return;                // ...and only on every other frame
  asphalt.visible = false;
  _mirrorOBR.call(this,r,s,c);
  asphalt.visible = true;
};

const FZ0=-30, FZ1=20, FLEN=FZ1-FZ0, FCZ=(FZ0+FZ1)/2, FH=20;
function buildFacade(side){   // side: -1 left, +1 right
  const g = new THREE.Group(); world.add(g);
  const mat = side<0 ? M.brickL : M.brickR;
  const wall = mesh(new THREE.PlaneGeometry(FLEN,FH), mat, side*ALLEY_HW, FH/2, FCZ, 0, side<0?Math.PI/2:-Math.PI/2, 0, g);
  wall.castShadow=false;
  // building mass behind the facade (roofline silhouette)
  const mass = mesh(GEO.box, M.massL, side*(ALLEY_HW+5.0), FH/2+0.6, FCZ, 0,0,0, g);
  mass.scale.set(10, FH+1.2, FLEN);
  // base course of concrete
  const base = mesh(GEO.box, M.concLong, side*(ALLEY_HW-0.09), 0.85, FCZ, 0,0,0, g);
  base.scale.set(0.18, 1.7, FLEN);
  // cornices
  [5.9, 12.6, 19.2].forEach((y,i)=>{
    const c = mesh(GEO.box, M.concLong, side*(ALLEY_HW-0.16), y, FCZ, 0,0,0, g);
    c.scale.set(0.34, i===2?0.5:0.28, FLEN);
  });
  // pilasters
  for(let z=FZ0+2; z<FZ1; z+=6.5){
    const p = mesh(GEO.box, side<0?M.pilL:M.pilR, side*(ALLEY_HW-0.11), 9.6, z, 0,0,0, g);
    p.scale.set(0.22, 19.2, 0.85);
  }
  // windows
  const glassG = new THREE.PlaneGeometry(0.95,1.35);
  for(let z=FZ0+4.6; z<FZ1-1; z+=3.15){
    for(let y=3.1; y<18; y+=3.35){
      const recess = mesh(GEO.box, M.conc, side*(ALLEY_HW-0.05), y, z, 0,0,0, g);
      recess.scale.set(0.14, 1.72, 1.28);
      const lit = rand()<0.10;
      const gl = mesh(glassG, lit?M.glassLit:M.glass, side*(ALLEY_HW-0.14), y, z,
                      0, side<0?Math.PI/2:-Math.PI/2, 0, g);
      gl.castShadow=false;
      if(lit){
        // cheap warm spill: a glow card instead of another real light
        const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.glow, color:0xffb277,
          blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity:0.16, fog:true}));
        sp.position.set(side*(ALLEY_HW-0.28), y, z); sp.scale.setScalar(1.6); g.add(sp);
      }
      // mullions
      const mu = mesh(GEO.box, M.metal, side*(ALLEY_HW-0.15), y, z, 0,0,0, g);
      mu.scale.set(0.05, 1.42, 0.05);
      mu.castShadow=false;
    }
  }
  // graffiti decals near the ground
  for(let k=0;k<4;k++){
    const t = makeGraffiti(512,256);
    const gm = new THREE.MeshStandardMaterial({map:t, transparent:true, roughness:0.95,
                 color:0x5a5a5a, opacity:0.85,
                 metalness:0.0, envMapIntensity:0.25, depthWrite:false,
                 polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2});
    const w = rr(2.2,3.4), hh=w*0.5;
    const d = mesh(new THREE.PlaneGeometry(w,hh), gm, side*(ALLEY_HW-0.2), rr(1.1,2.6), rr(FZ0+8,FZ1-4),
                   0, side<0?Math.PI/2:-Math.PI/2, rr(-0.05,0.05), g);
    d.castShadow=false; d.receiveShadow=false; d.renderOrder=2;
  }
  // downpipes + conduits
  for(let k=0;k<7;k++){
    const z = rr(FZ0+4, FZ1-2);
    const p = mesh(GEO.cyl, M.pipe, side*(ALLEY_HW-0.24), 9, z, 0,0,0, g);
    p.scale.set(0.07,18,0.07);
    for(let by=1.2; by<18; by+=rr(2.5,4.5)){
      const br = mesh(GEO.cyl, M.pipe, side*(ALLEY_HW-0.19), by, z, 0,0,Math.PI/2, g);
      br.scale.set(0.045,0.16,0.045);
    }
  }
  // horizontal conduit run
  const cd = mesh(GEO.cyl, M.pipe, side*(ALLEY_HW-0.3), 3.35, FCZ, Math.PI/2,0,0, g);
  cd.scale.set(0.05, FLEN*0.8, 0.05);
  // AC units
  for(let k=0;k<5;k++){
    const z=rr(FZ0+6,FZ1-3), y=rr(3.4,11);
    const ac = mesh(GEO.box, M.metal, side*(ALLEY_HW-0.42), y, z, 0,0,0, g);
    ac.scale.set(0.8, 0.62, 0.86);
    const gr = mesh(GEO.cyl, M.pipe, side*(ALLEY_HW-0.84), y, z, 0,0,Math.PI/2, g);
    gr.scale.set(0.26,0.04,0.26);
  }
  return g;
}

   7. atmospherics — light shafts, mist, steam, embers, dust

const ShaftMat = (color, intensity, noiseScale=1.0) => new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  side:THREE.FrontSide, fog:false,
  uniforms:{
    uColor:{value:new THREE.Color(color)}, uInt:{value:intensity},
    uTime:{value:0}, tNoise:{value:TEX.ripple}, uNS:{value:noiseScale}
  },
  vertexShader:`
    varying vec3 vN; varying vec3 vV; varying vec2 vUv; varying float vH; varying float vD;
    void main(){
      vUv = uv; vH = uv.y;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      vV = -mv.xyz; vD = -mv.z;
      vN = normalMatrix * normal;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform vec3 uColor; uniform float uInt, uTime, uNS; uniform sampler2D tNoise;
    varying vec3 vN; varying vec3 vV; varying vec2 vUv; varying float vH; varying float vD;
    void main(){
      float d = abs(dot(normalize(vN), normalize(vV)));
      float core = pow(d, 1.35);
      float fadeTop = smoothstep(0.0, 0.22, vH);
      float fadeBot = smoothstep(0.0, 0.42, 1.0-vH);
      float n = texture2D(tNoise, vec2(vUv.x*2.0, vUv.y*1.3*uNS - uTime*0.035)).r;
      float n2= texture2D(tNoise, vec2(vUv.x*4.0+0.37, vUv.y*2.6*uNS - uTime*0.052)).g;
      float dust = 0.55 + 0.75*(n*0.6+n2*0.4);
      float a = core * fadeTop * fadeBot * dust * uInt;
      a *= smoothstep(0.8, 4.5, vD);          // never blow out in the camera's lap
      gl_FragColor = vec4(uColor * a, a);
    }`
});
const shafts = [];
function addShaft(x,y,z, rTop,rBot, h, rot, color, inten, ns=1){
  const geo = new THREE.CylinderGeometry(rTop, rBot, h, 26, 1, true);

  m.position.set(x,y,z); m.rotation.set(rot[0],rot[1],rot[2]);
  m.renderOrder = 6; world.add(m); shafts.push(m); return m;
}

const dust=(()=>{
  const N=520, pos=new Float32Array(N*3), seed=new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]  = rr(-3.3,3.3);
    pos[i*3+1]= rr(0.15,9.0);
    pos[i*3+2]= rr(-24,16);
    seed[i]=rand()*100;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
  const m=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:{value:0}, uTex:{value:TEX.glow}, uSize:{value:26.0} },
    vertexShader:`
      attribute float aSeed; uniform float uTime,uSize; varying float vA;
      void main(){
        vec3 p = position;
        p.x += sin(uTime*0.28 + aSeed)*0.55;
        p.y += sin(uTime*0.19 + aSeed*1.7)*0.35;
        p.z += cos(uTime*0.23 + aSeed*0.9)*0.55;
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uSize * (1.0/max(0.001,-mv.z));
        vA = 0.35 + 0.65*abs(sin(uTime*0.7 + aSeed*3.1));
        vA *= smoothstep(30.0, 6.0, -mv.z);
      }`,
    fragmentShader:`
      uniform sampler2D uTex; varying float vA;
      void main(){
        float a = texture2D(uTex, gl_PointCoord).a * vA;
        gl_FragColor = vec4(vec3(0.78,0.85,1.0)*a*1.4, a);
      }`
  });
  const p=new THREE.Points(g,m); p.renderOrder=8; world.add(p); return {p,m};
})();

function buildHumanoid(cfg){
  const P = Object.assign({
    hipY:0.94, thigh:0.45, shin:0.44, torso:0.62, neck:0.10, headR:0.115,
    shoulderHW:0.28, upperArm:0.31, foreArm:0.30,
    chestR:0.235, waistR:0.185, limbR:0.075, armR:0.062, hipHW:0.11,
    torsoDepth:0.66, matSuit:CH.suit, matLegs:CH.suit, matArms:CH.suit,
    matBoot:CH.boot, matHead:CH.suit, bulk:1.0
  }, cfg);

  const root=new THREE.Group();
  const hips=new THREE.Group(); hips.position.y=P.hipY; root.add(hips);
  const pelvis=new THREE.Mesh(GEO.sph, P.matSuit);
  pelvis.scale.set(P.chestR*0.86, 0.16, P.chestR*0.62); pelvis.position.y=0.02;
  pelvis.castShadow=pelvis.receiveShadow=true; hips.add(pelvis);

  // torso
  const torso=new THREE.Group(); hips.add(torso);
  const chest=tapered(P.chestR, P.waistR, P.torso, P.matSuit, torso, P.torso/2);
  chest.scale.z = P.torsoDepth;
  // upper-body mass: pecs + lats give the V taper a cylinder can't
  const ribs=new THREE.Mesh(GEO.sph, P.matSuit);
  ribs.scale.set(P.chestR*1.10, P.torso*0.34, P.chestR*P.torsoDepth*1.18);
  ribs.position.y=P.torso*0.70; ribs.castShadow=ribs.receiveShadow=true; torso.add(ribs);
  const shoulderPad=new THREE.Mesh(GEO.sph, P.matSuit);
  shoulderPad.scale.set(P.shoulderHW*1.08, P.chestR*0.52, P.chestR*0.74);
  shoulderPad.position.y=P.torso-0.10; shoulderPad.castShadow=true; torso.add(shoulderPad);

  // head
  const neckG=new THREE.Group(); neckG.position.y=P.torso; torso.add(neckG);
  tapered(P.headR*0.52, P.headR*0.62, P.neck, P.matHead, neckG, P.neck/2);
  const headG=new THREE.Group(); headG.position.y=P.neck+P.headR*0.72; neckG.add(headG);
  const head=new THREE.Mesh(GEO.sph, P.matHead);
  head.scale.set(P.headR*0.93, P.headR*1.12, P.headR);
  head.castShadow=head.receiveShadow=true; headG.add(head);

  // arms
  const arms=[];
  for(const s of [-1,1]){
    const sh=new THREE.Group(); sh.position.set(s*P.shoulderHW, P.torso-0.09, 0); torso.add(sh);
    const delt=joint(P.armR*1.4, P.matArms, sh, 0.01);
    delt.scale.set(P.armR*1.4, P.armR*1.6, P.armR*1.45);
    tapered(P.armR*1.22, P.armR*0.95, P.upperArm, P.matArms, sh);
    const el=new THREE.Group(); el.position.y=-P.upperArm; sh.add(el);
    joint(P.armR*0.92, P.matArms, el);
    tapered(P.armR*0.92, P.armR*0.78, P.foreArm, P.matArms, el);
    const hand=new THREE.Mesh(GEO.sph, P.matArms);
    hand.scale.set(P.armR*1.0, P.armR*1.25, P.armR*0.72);
    hand.position.y=-P.foreArm-P.armR*0.6; hand.castShadow=true; el.add(hand);
    arms.push({sh, el, side:s});
  }

  // legs
  const legs=[];
  for(const s of [-1,1]){
    const hp=new THREE.Group(); hp.position.set(s*P.hipHW, -0.02, 0); hips.add(hp);
    joint(P.limbR*1.12, P.matLegs, hp);
    tapered(P.limbR*1.32, P.limbR*0.95, P.thigh, P.matLegs, hp);
    const kn=new THREE.Group(); kn.position.y=-P.thigh; hp.add(kn);
    joint(P.limbR*0.9, P.matLegs, kn);
    tapered(P.limbR*0.95, P.limbR*0.74, P.shin, P.matLegs, kn);
    const an=new THREE.Group(); an.position.y=-P.shin; kn.add(an);
    const foot=new THREE.Mesh(GEO.box, P.matBoot);
    foot.scale.set(P.limbR*2.15, P.limbR*1.3, P.limbR*3.5);
    foot.position.set(0,-P.limbR*0.5, P.limbR*0.85);
    foot.castShadow=foot.receiveShadow=true; an.add(foot);
    legs.push({hp, kn, an, side:s});
  }

  return {root, hips, torso, neckG, headG, head, chest, arms, legs, P, phase:rand()*6.28};
}

/* --- walk / idle driver --------------------------------------------------- */
function poseWalk(h, phase, amt, time){
  const rest = 1-amt;
  const breath = Math.sin((time||0)*1.6)*0.5+0.5;
  h.legs.forEach(L=>{
    const d = L.side<0 ? 0 : Math.PI;
    const p = phase + d;
    L.hp.rotation.x = Math.sin(p)*0.52*amt + (L.side<0 ? 0.06 : -0.05)*rest;
    L.kn.rotation.x = Math.max(0, -Math.sin(p+0.85))*1.05*amt + (L.side<0 ? 0.16 : 0.06)*rest;
    L.an.rotation.x = (-Math.sin(p+0.4)*0.22 + 0.1)*amt - 0.05*rest;
    L.hp.rotation.z = L.side*0.03*rest;
  });
  h.arms.forEach(A=>{
    const d = A.side<0 ? Math.PI : 0;
    const p = phase + d;
    A.sh.rotation.x = Math.sin(p)*0.38*amt + 0.06*rest;
    A.sh.rotation.z = A.side*(0.075 + 0.035*amt + 0.075*rest);
    A.el.rotation.x = -(0.28 + Math.max(0,Math.sin(p+1.0))*0.42)*amt - 0.12 - 0.30*rest;
  });
  h.hips.position.y = h.P.hipY + Math.abs(Math.cos(phase))*0.028*amt - 0.012*amt
                    - rest*(0.022 - breath*0.006);
  h.hips.rotation.z = Math.sin(phase)*0.035*amt + 0.035*rest;
  h.torso.rotation.y = -Math.sin(phase)*0.075*amt - 0.05*rest;
  h.torso.rotation.x = 0.04*amt + (0.045 + breath*0.012)*rest;
}

function updateCape(t, speed){
  const pos=batman.cape.geometry.attributes.position;
  const base=batman.capeBase;
  const n=pos.count;
  const sway = Math.sin(t*1.35)*0.06 + Math.sin(t*2.1+1.0)*0.03;
  for(let i=0;i<n;i++){
    const u  = base[i*3];                        // -0.5 .. 0.5 across the cloth
    const v  = clamp(-base[i*3+1]/CAPE_H, 0, 1); // 0 at the collar, 1 at the hem
    // the cloth is a partial cone wrapped around the body, widening toward the hem
    let ang = u * 2.0 * lerp(1.42, 2.06, Math.pow(v,0.8));
    ang += (sway + Math.sin(t*1.9 + v*2.4)*0.09) * v;
    let R = lerp(0.255, 0.595 + speed*0.20, Math.pow(v,1.22));
    R += Math.sin(ang*4.5)*0.042*Math.pow(v,1.2);          // standing folds
    R += Math.sin(ang*9.0+1.1)*0.013*Math.pow(v,1.45);
    R += Math.sin(t*3.0 + v*5.2 - ang*1.7)*0.038*Math.pow(v,1.6)*(0.4+speed);
    const x = Math.sin(ang)*R;
    let   z = -Math.cos(ang)*R;
    let   y = -v*CAPE_H;
    z -= speed*0.33*Math.pow(v,1.3);                        // trails while walking
    y += speed*0.12*v + Math.sin(t*2.6+v*3.0)*0.010*v;
    pos.setXYZ(i, x, y, z);
  }
  pos.needsUpdate=true;
  batman.cape.geometry.computeVertexNormals();
}

/* ══════════════════════════════════════════════════════════════════════════
   9. post-processing stack
   ══════════════════════════════════════════════════════════════════════════ */
const GradeShader = {
  uniforms:{ tDiffuse:{value:null}, uTime:{value:0}, uGrain:{value:0.055},
             uVig:{value:1.02}, uAber:{value:0.55}, uFade:{value:0.0},
             uPunch:{value:0.0}, uFlash:{value:0.0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uTime,uGrain,uVig,uAber,uFade,uPunch,uFlash;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
    void main(){
      vec2 uv=vUv; vec2 d=uv-0.5; float r2=dot(d,d);
      float ab = uAber*r2*0.02*(1.0 + uPunch*2.2);
      vec3 col;
      if(uPunch > 0.004){
        // radial smear on impact — reads as motion blur through the hit
        vec3 acc = vec3(0.0);
        for(int i=0;i<5;i++){
          float sc = 1.0 - float(i)*0.0095*uPunch;
          vec2 p2  = 0.5 + d*sc;
          acc.r += texture2D(tDiffuse, p2 - d*ab).r;
          acc.g += texture2D(tDiffuse, p2).g;
          acc.b += texture2D(tDiffuse, p2 + d*ab).b;
        }
        col = acc*0.2;
      } else {
        col.r = texture2D(tDiffuse, uv - d*ab).r;
        col.g = texture2D(tDiffuse, uv).g;
        col.b = texture2D(tDiffuse, uv + d*ab).b;
      }
      float v = smoothstep(0.92,0.16, r2*uVig);
      col *= mix(0.46,1.0,v);
      float l = dot(col, vec3(0.299,0.587,0.114));
      col = mix(col, col*vec3(0.84,0.93,1.22), (1.0-smoothstep(0.0,0.5,l))*0.6);  // cool shadows
      col = mix(col, col*vec3(1.07,1.00,0.92), smoothstep(0.55,1.0,l)*0.4);        // warm highlights
      float g = hash(uv*vec2(1533.0,977.0) + fract(uTime*0.97)*211.0) - 0.5;
      col += g*uGrain*(1.15 - l*0.65);
      col += vec3(0.80,0.86,1.0)*uFlash*(0.35 + 0.65*smoothstep(0.30,0.0,r2));
      col *= (1.0-uFade);
      gl_FragColor = vec4(col,1.0);
    }`
};

const VW = Math.max(2, innerWidth||1280), VH = Math.max(2, innerHeight||720);
/* The composer's default depth renderbuffer is 16-bit, which z-fights badly
   once the far plane is kilometres out. Attach real 24-bit depth textures
   instead — GTAO and the DOF pass keep their own high-precision depth. */
function hdrTarget(w,h){
  const t = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType });
  t.depthTexture = new THREE.DepthTexture(w, h, THREE.UnsignedIntType);
  return t;
}
const composer = new EffectComposer(renderer, hdrTarget(VW, VH));
composer.renderTarget2.depthTexture = new THREE.DepthTexture(VW, VH, THREE.UnsignedIntType);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(VW, VH);

const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

let gtao = null;
try{
  gtao = new GTAOPass(scene, camera, VW, VH);
  gtao.output = GTAOPass.OUTPUT.Default;
  gtao.blendIntensity = 0.55;
  gtao.updateGtaoMaterial({ radius:0.18, distanceExponent:1.0, thickness:1.0,
                            scale:1.0, samples:16, distanceFallOff:1.0, screenSpaceRadius:false });
  gtao.updatePdMaterial({ lumaPhi:10, depthPhi:2, normalPhi:3, radius:4, radiusExponent:1, rings:2, samples:16 });
  composer.addPass(gtao);
}catch(e){ console.warn('[alley] GTAO unavailable:', e && e.message); }

const bokeh = new BokehPass(scene, camera, { focus: 8.0, aperture: 0.0009, maxblur: 0.0052 });
composer.addPass(bokeh);

const bloom = new UnrealBloomPass(new THREE.Vector2(VW, VH), 0.46, 0.72, 0.85);
composer.addPass(bloom);

composer.addPass(new OutputPass());

const grade = new ShaderPass(GradeShader);

   9b. pose system — small keyframe rig used for the fight choreography
   ══════════════════════════════════════════════════════════════════════════ */
const PK = ['hipY','hipYaw','hipZ','hipX','torX','torY','torZ','hdX','hdY',
            'lShX','lShY','lShZ','lElX','rShX','rShY','rShZ','rElX',
            'lHpX','lKnX','lAnX','lHpZ','rHpX','rKnX','rAnX','rHpZ',
            'yaw','fwd','side'];
const PKN = PK.length;
const PKI = {}; PK.forEach((k,i)=>PKI[k]=i);
function pose(o){ const a=new Float32Array(PKN); for(const k in o) a[PKI[k]] = o[k]; return a; }
const _pmix = new Float32Array(PKN);
function poseMix(a,b,t,out){
  out = out || _pmix;
  for(let i=0;i<PKN;i++) out[i] = a[i] + (b[i]-a[i])*t;
  return out;
}
/* k<1 eases the current rig toward the pose instead of snapping to it */
function applyPose(h, a, k){
  k = (k===undefined) ? 1 : clamp(k,0,1);
  const ap = (obj, axis, v)=>{ obj.rotation[axis] += (v - obj.rotation[axis])*k; };
  h.hips.position.y += (h.P.hipY + a[0] - h.hips.position.y)*k;
  ap(h.hips,'y',a[1]); ap(h.hips,'z',a[2]); ap(h.hips,'x',a[3]);
  ap(h.torso,'x',a[4]); ap(h.torso,'y',a[5]); ap(h.torso,'z',a[6]);
  ap(h.headG,'x',a[7]); ap(h.headG,'y',a[8]);
  const AL=h.arms[0], AR=h.arms[1];
  ap(AL.sh,'x',a[9]);  ap(AL.sh,'y',a[10]); ap(AL.sh,'z',a[11]); ap(AL.el,'x',a[12]);
  ap(AR.sh,'x',a[13]); ap(AR.sh,'y',a[14]); ap(AR.sh,'z',a[15]); ap(AR.el,'x',a[16]);
  const LL=h.legs[0], LR=h.legs[1];
  ap(LL.hp,'x',a[17]); ap(LL.kn,'x',a[18]); ap(LL.an,'x',a[19]); ap(LL.hp,'z',a[20]);
  ap(LR.hp,'x',a[21]); ap(LR.kn,'x',a[22]); ap(LR.an,'x',a[23]); ap(LR.hp,'z',a[24]);
}
/* sample a keyframe track: [{t, p}] */
function trackAt(keys, t){
  if(t <= keys[0].t) return keys[0].p;
  for(let i=1;i<keys.length;i++){
    if(t <= keys[i].t){
      const a=keys[i-1], b=keys[i];
      const k = (b.t===a.t) ? 1 : (t-a.t)/(b.t-a.t);
      return poseMix(a.p, b.p, (b.snap ? k : easeInOut(k)));
    }
  }
  return keys[keys.length-1].p;
}

/* ══════════════════════════════════════════════════════════════════════════
   9c. impact FX — hit-stop, shake, flash, radial punch blur, sparks
   ══════════════════════════════════════════════════════════════════════════ */
const FX = { shake:0, flash:0, punch:0, slowmo:0, bloom:0 };
const sparks = [];
{
  for(let i=0;i<26;i++){
    const m=new THREE.SpriteMaterial({map:TEX.glow, color:0xfff2d0, transparent:true,
      opacity:0, depthWrite:false, blending:THREE.AdditiveBlending, fog:true});
    const s=new THREE.Sprite(m); s.renderOrder=9; s.visible=false; scene.add(s);
    sparks.push({s, life:0, vx:0, vy:0, vz:0});
  }
}
const _impactPt = new THREE.Vector3();
function burstSparks(x,y,z,dirZ){
  let n=0;
  for(const p of sparks){
    if(p.life>0) continue;
    p.s.position.set(x+rr(-0.05,0.05), y+rr(-0.05,0.05), z+rr(-0.05,0.05));
    p.vx=rr(-1.6,1.6); p.vy=rr(0.4,2.6); p.vz=dirZ*rr(0.8,3.0)+rr(-0.8,0.8);
    p.life=1; p.s.visible=true;
    if(++n>=14) break;
  }
}
function updateSparks(dt){
  for(const p of sparks){
    if(p.life<=0) continue;
    p.life -= dt*2.4;
    if(p.life<=0){ p.s.visible=false; p.s.material.opacity=0; continue; }
    p.vy -= 7.0*dt;
    p.s.position.x += p.vx*dt; p.s.position.y += p.vy*dt; p.s.position.z += p.vz*dt;
    p.s.scale.setScalar(0.10*p.life + 0.02);
    p.s.material.opacity = Math.pow(p.life,0.8)*0.95;
  }
}
function triggerImpact(x,y,z,dirZ,power){
  FX.shake  = Math.max(FX.shake, 0.11*power);
  FX.flash  = Math.max(FX.flash, 0.42*power);
  FX.punch  = Math.max(FX.punch, 1.0*power);
  FX.slowmo = Math.max(FX.slowmo, 1.0);
  FX.bloom  = Math.max(FX.bloom, 0.55*power);
  burstSparks(x,y,z,dirZ);
}
function updateFX(dt){
  FX.shake  = Math.max(0, FX.shake  - dt*0.55);
  FX.flash  = Math.max(0, FX.flash  - dt*2.6);
  FX.punch  = Math.max(0, FX.punch  - dt*4.2);
  FX.slowmo = Math.max(0, FX.slowmo - dt*2.6);
  FX.bloom  = Math.max(0, FX.bloom  - dt*1.6);
  updateSparks(dt);
}
/* time scale: a hard hit-stop then a short ramp back to real time */
function timeScale(){
  if(FX.slowmo <= 0) return 1;
  const s = FX.slowmo;                      // 1 → 0
  if(s > 0.86) return 0.06;                 // hit-stop
  return clamp(0.30 + (0.86-s)*0.95, 0.06, 1);
}
