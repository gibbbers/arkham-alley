  {k:'walk',  t0:23.2,  t1:28.6,  z0:-7.40,  z1:BAT_Z1},
  {k:'flip',  t0:28.6,  t1:30.8,  z0:BAT_Z1, z1:BAT_Z1},   // camera swings behind him
  {k:'face',  t0:30.8,  t1:32.2,  z0:BAT_Z1, z1:BAT_Z1},   // hold, beat before he speaks
  {k:'dlg',   t0:32.2,  t1:54.9,  z0:BAT_Z1, z1:BAT_Z1},
  {k:'out',   t0:54.9,  t1:57.6,  z0:BAT_Z1, z1:BAT_Z1}
];
/* dialogue clock — the two supplied recordings are 8.28s and 13.84s */
const DLG_BAT_T = 32.20, DLG_GAP = 0.42;
let   DLG_BAT_D = 8.30, DLG_JOK_D = 13.85;
let   DLG_JOK_T = DLG_BAT_T + DLG_BAT_D + DLG_GAP;
let   DLG_END   = DLG_JOK_T + DLG_JOK_D;
/* the recordings report their real length once they load — trust that over the
   hard-coded estimate, so captions and cues stay frame-accurate */
function syncDialogueClock(batDur, jokDur){
  if(batDur && Math.abs(batDur-DLG_BAT_D) < 1.5) DLG_BAT_D = batDur;
  if(jokDur && Math.abs(jokDur-DLG_JOK_D) < 1.5) DLG_JOK_D = jokDur;
  DLG_JOK_T = DLG_BAT_T + DLG_BAT_D + DLG_GAP;
  DLG_END   = DLG_JOK_T + DLG_JOK_D;
}
const JOKER_IN_T = 28.40;
const LOOP = 57.6;
/* which crook fights when — nearest one first */
const FIGHT_CROOK = [2, 1, 0];
const FIGHT_OFF   = [ 1.35, -1.30,  1.15];    // lateral of Batman — keeps the pair off-axis
const FIGHT_FWD   = [ 1.15,  1.20,  1.10];    // ...and how far up the alley
const TRACKS      = [makeTracks(0), makeTracks(1), makeTracks(2)];

function phaseAt(t){
  for(let i=0;i<PHASES.length;i++) if(t < PHASES[i].t1) return PHASES[i];
  return PHASES[PHASES.length-1];
}
/* the fight a given crook belongs to, and its start time (or null) */
const CROOK_FIGHT = [];
PHASES.forEach(p=>{ if(p.k==='fight') CROOK_FIGHT[FIGHT_CROOK[p.fi]] = p; });

let lastHit = -1;
const _blockPos = new THREE.Vector3();
const _axisY = new THREE.Vector3(0,1,0), _axisX = new THREE.Vector3(1,0,0);
const _qYaw = new THREE.Quaternion(), _qTip = new THREE.Quaternion();
function blockPosFor(fi, batZ){
  return _blockPos.set(BAT_X + FIGHT_OFF[fi], 0, batZ + FIGHT_FWD[fi]);
}
function blockYaw(fi){ return Math.atan2(-FIGHT_OFF[fi], -FIGHT_FWD[fi]); }

/* ---- actors --------------------------------------------------------------- */
const batPos   = new THREE.Vector3(BAT_X, 0, BAT_Z0);
const _crookPt = new THREE.Vector3();
const _fightMid= new THREE.Vector3(0,1.15,0);
let   walkPhase = 0, prevBatZ = BAT_Z0, capeEnergy = 0;
const crookPhase = [0,0,0];

function updateActors(t, dt){
  const ph = phaseAt(t);
  const u  = clamp((t-ph.t0)/Math.max(0.001, ph.t1-ph.t0), 0, 1);
  const walking = (ph.k==='walk' || ph.k==='step');
  const ease = ph.k==='step' ? easeInOut(u) : lerp(u, smooth(u), 0.42);
  const z = lerp(ph.z0, ph.z1, walking ? ease : 1);

  batPos.set(BAT_X, 0, z);
  const speed  = Math.abs(z - prevBatZ)/Math.max(dt,1e-4);
  prevBatZ = z;
  const nSpeed = clamp(speed/1.7, 0, 1.15);
  walkPhase += speed * 3.05 * dt;

  /* --- Batman ------------------------------------------------------------ */
  let fightBlend = 0, tau = -1, fi = -1;
  if(ph.k==='fight'){
    fi  = ph.fi;
    tau = t - ph.t0;
    fightBlend = smoothstep(0.0,0.32,tau) * (1 - smoothstep(FIGHT_END-0.30, FIGHT_END, tau));
  }
  batman.root.position.copy(batPos);
  batman.root.rotation.y = Math.sin(t*0.4)*0.02;
  poseWalk(batman, walkPhase, clamp(nSpeed*1.1,0,1), t);

  let batFwd = 0, batSide = 0;
  if(fightBlend > 0){
    const bp = trackAt(TRACKS[fi].bat, tau);
    applyPose(batman, bp, fightBlend);
    batFwd  = bp[PKI.fwd]  * fightBlend;
    batSide = bp[PKI.side] * fightBlend;
    // square up on the crook
    const bpz = blockPosFor(fi, ph.z0);
    batman.root.rotation.y = lerp(batman.root.rotation.y,
      Math.atan2(bpz.x-BAT_X, bpz.z-ph.z0), fightBlend);
  }
  { const y = batman.root.rotation.y, cy = Math.cos(y), sy = Math.sin(y);
    batman.root.position.x += sy*batFwd + cy*batSide;
    batman.root.position.z += cy*batFwd - sy*batSide; }

  // head: watch the next threat while walking, lock on during a fight
  if(fightBlend < 0.4){
    const nf = PHASES.find(p=>p.k==='fight' && p.t1 > t);
    if(nf){
      const c = crooks[FIGHT_CROOK[nf.fi]];
      const a = Math.atan2(c.root.position.x-batPos.x, c.root.position.z-batPos.z);
      batman.headG.rotation.y += (clamp(a,-0.5,0.5)*0.7 - batman.headG.rotation.y)*Math.min(1,dt*2.0);
    }
  }

  capeEnergy += ((nSpeed + FX.punch*0.9 + (fightBlend>0?0.25:0)) - capeEnergy)*Math.min(1, dt*6);
  updateCape(t, capeEnergy);

  /* --- crooks ------------------------------------------------------------ */
  crooks.forEach((c,ci)=>{
    const cf = CROOK_FIGHT[ci];
    const spec = crookSpecs[ci];
    if(cf){
      const ctau = t - cf.t0;
      const koT  = ctau - IMPACT_T;
      const bpz  = blockPosFor(cf.fi, cf.z0);
      if(koT > 0){
        /* ---- dropped ---- */
        const k = clamp(koT/0.95, 0, 1), e = easeOut(k);
        const ky = blockYaw(cf.fi) + (spec.spin||0.2)*e;
        c.root.position.set(bpz.x, 0, bpz.z);
        c.root.position.x -= Math.sin(ky)*0.46*e + (spec.fallX||0.3)*e*0.35;
        c.root.position.z -= Math.cos(ky)*0.46*e;
        c.root.position.y  = Math.sin(Math.PI*clamp(k*1.15,0,1))*0.10*(1-e*0.5) + e*0.19;
        _qYaw.setFromAxisAngle(_axisY, ky);
        _axisX.set(Math.cos(ky), 0, -Math.sin(ky));
        _qTip.setFromAxisAngle(_axisX, -e*1.52);
        c.root.quaternion.copy(_qTip).multiply(_qYaw);
        const limpK = clamp(koT/0.55,0,1);
        applyPose(c, poseMix(CR.hit, CR.limp, limpK), 1);
        return;
      }
      if(ctau > -0.55){
        /* ---- stepping in and squaring up ---- */
        const stepK = clamp((ctau+0.55)/1.30, 0, 1);
        const se = easeInOut(stepK);
        c.root.position.set(lerp(spec.x, bpz.x, se), 0, lerp(spec.z, bpz.z, se));
        c.root.rotation.set(0, lerp(spec.ry, blockYaw(cf.fi), se), 0);
        crookPhase[ci] += (1-stepK)*7.0*dt;
        poseWalk(c, crookPhase[ci], (1-stepK)*0.85, t);
        const blend = smoothstep(-0.25, 0.55, ctau);
        if(blend>0) applyPose(c, trackAt(TRACKS[cf.fi].crook, Math.max(0,ctau)), blend);
        // pose-driven lunge
        if(ctau>0){
          const cp = trackAt(TRACKS[cf.fi].crook, ctau);
          const y = c.root.rotation.y, f = cp[PKI.fwd]*blend;
          c.root.position.x += Math.sin(y)*f;
          c.root.position.z += Math.cos(y)*f;
        }
        return;
      }
    }
    /* ---- not engaged yet: watch and shift ---- */
    const d = Math.hypot(c.root.position.x-batPos.x, c.root.position.z-batPos.z);
    const alert = smoothstep(13.0, 6.0, d);
    const want = Math.atan2(batPos.x-c.root.position.x, batPos.z-c.root.position.z);
    c.root.position.set(spec.x, 0, spec.z);
    c.root.rotation.x = c.root.rotation.z = 0;
    c.root.rotation.y += ((lerp(spec.ry, want, alert*0.9) - c.root.rotation.y))*Math.min(1, dt*2.2);
    const p = t*1.15 + c.idlePh;
    c.hips.position.y = c.P.hipY + Math.sin(p*0.9)*0.012 - alert*0.045;
    c.hips.rotation.set(0,0,Math.sin(p*0.55)*0.03);
    c.torso.rotation.set(0.03 + Math.sin(p*1.9)*0.012, Math.sin(p*0.42+1.1)*0.06 - alert*0.05, 0);
    const br = 1.0 + Math.sin(p*1.35)*0.012;
    c.chest.scale.x = br; c.chest.scale.z = c.P.torsoDepth*br;
    c.headG.rotation.set(-alert*0.05, Math.sin(p*0.6)*0.12*(1-alert), 0);
    c.arms.forEach(A=>{
      A.sh.rotation.set(Math.sin(p*0.5+A.side*1.3)*0.05 - alert*0.22, 0,
                        A.side*(0.30 - alert*0.08 + Math.sin(p*0.7+A.side)*0.02));
      A.el.rotation.x = -0.35 - alert*0.95 + Math.sin(p*0.8)*0.04;
    });
    c.legs.forEach(L=>{ L.hp.rotation.set(-alert*0.06,0,L.side*0.05); L.kn.rotation.x = 0.06+alert*0.18; L.an.rotation.x=0; });
  });

  /* --- the Joker ---------------------------------------------------------- */
  updateJoker(t, dt);

  /* --- the counter connects --------------------------------------------- */
  if(ph.k==='fight'){
    const hitT = ph.t0 + IMPACT_T;
    if(lastHit !== ph.t0 && t >= hitT && t < hitT + 0.4){
      lastHit = ph.t0;
      const bpz = blockPosFor(ph.fi, ph.z0);
      triggerImpact(bpz.x, 1.52, bpz.z - 0.30, 1, ph.fi===2 ? 1.25 : 1.0);
    }
    if(t < hitT - 0.5) lastHit = -1;
  }
  return {ph, tau, fi, nSpeed};
}

/* ---- the Joker: enter, listen, then hold court --------------------------- */
const _jokTmp = new Float32Array(PKN);
function updateJoker(t, dt){
  if(t < JOKER_IN_T){
    joker.root.visible = false;
    jokerRim.intensity = jokerKey.intensity = 0;
    return;
  }
  joker.root.visible = true;
  const revealed = smoothstep(JOKER_IN_T, JOKER_IN_T+1.4, t);
  jokerRim.intensity = 24*revealed;
  jokerKey.intensity = 11*revealed;

  // walk out of the shadows onto his mark
  const walkU = clamp((t-JOKER_IN_T)/2.10, 0, 1);
  const we = easeInOut(walkU);
  joker.root.position.lerpVectors(JOKER_WAIT, JOKER_MARK, we);
  const facing = Math.PI + Math.sin(t*0.21)*0.02;
  joker.root.rotation.y = lerp(Math.PI - 0.55, facing, we);
  jokerWalkPhase += (1-walkU)*6.4*dt;
  poseWalk(joker, jokerWalkPhase, (1-walkU)*0.9, t);

  // pose track through the beat
  let target = JP.stand, blend = smoothstep(0.55, 1.0, walkU);
  const sway = Math.sin(t*0.9)*0.5 + 0.5;
  if(t >= DLG_BAT_T && t < DLG_JOK_T){
    target = poseMix(JP.stand, JP.listen, smoothstep(DLG_BAT_T, DLG_BAT_T+1.1, t), _jokTmp);
  } else if(t >= DLG_JOK_T){
    const u = clamp((t-DLG_JOK_T)/DLG_JOK_D, 0, 1);
    if(u < 0.17)      target = poseMix(JP.listen, JP.open,  smoothstep(0.02,0.15,u), _jokTmp);
    else if(u < 0.40) target = poseMix(JP.open,   JP.listen,smoothstep(0.17,0.30,u), _jokTmp);
    else if(u < 0.60) target = poseMix(JP.listen, JP.point, smoothstep(0.40,0.50,u), _jokTmp);
    else if(u < 0.80) target = poseMix(JP.point,  JP.open,  smoothstep(0.60,0.70,u), _jokTmp);
    else              target = poseMix(JP.open,   JP.laugh, smoothstep(0.80,0.88,u), _jokTmp);
  }
  applyPose(joker, target, blend);

  // life: weight shift, a tilted head, and the shoulders going on the laugh
  const laughing = (t >= DLG_JOK_T + DLG_JOK_D*0.80);
  const shake = laughing ? Math.sin(t*17.0)*0.045 + Math.sin(t*11.0)*0.03 : 0;
  joker.hips.position.y  += Math.sin(t*1.25)*0.012 + shake*0.5;
  joker.hips.rotation.z  += Math.sin(t*0.62)*0.035;
  joker.torso.rotation.z  = Math.sin(t*0.48+1.0)*0.04 + shake;
  joker.torso.rotation.x += shake*0.6;
  joker.headG.rotation.z  = 0.16 + Math.sin(t*0.71)*0.05 + shake*1.2;
  joker.headG.rotation.y += Math.sin(t*0.53)*0.05;
  if(joker.skirt) joker.skirt.rotation.x = Math.sin(t*1.1)*0.02;
  if(joker.tails) joker.tails.rotation.x = Math.sin(t*1.25+0.6)*0.05;
  jokerRim.position.set(joker.root.position.x + 0.15, 2.15, joker.root.position.z + 1.35);
  jokerKey.position.set(joker.root.position.x - 0.75, 1.85, joker.root.position.z - 1.15);
}

/* ---- camera --------------------------------------------------------------- */
const _tmpV = new THREE.Vector3();
const _heroDir = new THREE.Vector3();
const _camP = new THREE.Vector3(), _camL = new THREE.Vector3();
function shake(t, amp){
  return _tmpV.set(
    (Math.sin(t*1.7)+Math.sin(t*3.9)*0.5)*amp,
    (Math.sin(t*2.3+1.7)+Math.sin(t*5.1)*0.4)*amp*0.7,
    (Math.sin(t*1.1+3.1))*amp*0.5
  );
}
/* polar endpoints of the reveal swing, measured off Batman's mark */
const FLIP_A0 = Math.atan2(-1.25,  4.50), FLIP_R0 = Math.hypot(1.25, 4.50);
const FLIP_A1 = Math.atan2(-1.05, -2.15), FLIP_R1 = Math.hypot(1.05, 2.15);
function fightMid(fi, batZ){
  const b = blockPosFor(fi, batZ);
  return _fightMid.set((BAT_X + b.x)*0.5, 1.16, (batZ + b.z)*0.5);
}
function directCamera(t, ph){
  let fov = 38;
  if(ph.k === 'fight'){
    const tau = t - ph.t0, k = clamp(tau/FIGHT_END, 0, 1), e = easeInOut(k);
    const m = fightMid(ph.fi, ph.z0);
    // tighten hard through the counter
    const punch = smoothstep(IMPACT_T-0.75, IMPACT_T, tau) * (1-smoothstep(IMPACT_T+0.55, IMPACT_T+1.5, tau));
    // the alley is only ~6.8m wide, so coverage has to come from down-alley
    let off, la = 0.02;
    // stay near the centre line so the frame keeps alley depth, not flat wall
    if(ph.fi === 0){          // profile two-shot, alley running away behind them
      off = _camP.set(lerp( 2.55, 2.20,e), lerp(1.60,1.40,e), lerp(-5.40,-4.70,e));
      fov = lerp(44,39,e);
    } else if(ph.fi === 1){   // reverse, looking back up the alley into the god ray
      off = _camP.set(lerp(-2.38,-2.08,e), lerp(1.48,1.26,e), lerp(-2.38,-2.08,e));
      fov = lerp(46,42,e);
    } else {                  // low from the left, pushing in on the finisher
      off = _camP.set(lerp(-3.15,-2.75,e), lerp(1.05,1.55,e), lerp( 4.00, 3.35,e));
      fov = lerp(42,36,e);
    }
    off.x *= 1 - punch*0.06;  off.z *= 1 - punch*0.06;
    fov -= punch*1.5;
    _camP.set(m.x+off.x, off.y, m.z+off.z);
    _camL.set(m.x + (ph.fi===1 ? 0.16 : -0.16), m.y + la + punch*0.16, m.z);
  } else if(ph.k === 'walk' && ph.t0 < 10){
    /* --- the approach: the two original opening shots, retimed --- */
    if(t < 4.4){
      const k = easeInOut(clamp(t/4.4,0,1));
      _camP.set(lerp(1.45,0.75,k), lerp(0.62,0.95,k), lerp(7.6,4.6,k));
      _camL.set(batPos.x*0.55, lerp(1.35,1.30,k), batPos.z+1.2);
      fov = lerp(42,37,k);
    } else {
      const k = easeInOut(clamp((t-4.4)/2.6,0,1));
      _camP.set(lerp(-2.55,-2.30,k), lerp(1.78,1.40,k), batPos.z + lerp(5.1,3.9,k));
      _camL.set(batPos.x, lerp(1.10,1.16,k), batPos.z + lerp(0.3,0.1,k));
      fov = lerp(36,40,k);
    }
  } else if(ph.k === 'step' || ph.k === 'beat'){
    /* --- connective over-the-shoulder onto the next man --- */
    const k = easeInOut(clamp((t-ph.t0)/(ph.t1-ph.t0),0,1));
    const nf = PHASES.find(p=>p.k==='fight' && p.t0 >= t);
    const tgt = nf ? blockPosFor(nf.fi, nf.z0).clone()
                   : _blockPos.set(BAT_X, 0, ph.z1+2.6).clone();
    _camP.set(lerp(-1.55,-1.30,k), lerp(1.92,1.74,k), batPos.z - lerp(2.10,1.72,k));
    _camL.set(lerp(batPos.x, tgt.x, 0.65), lerp(1.42,1.30,k), lerp(batPos.z, tgt.z, 0.7));
    fov = lerp(40,36,k);
  } else if(ph.k === 'walk'){
    /* --- walking out toward the far end --- */
    const k = easeInOut(clamp((t-ph.t0)/(ph.t1-ph.t0),0,1));
    if(k < 0.5){
      const q = k/0.5;
      _camP.set(lerp(-2.45,-2.20,q), lerp(1.70,1.34,q), batPos.z + lerp(4.6,3.6,q));
      _camL.set(batPos.x, 1.16, batPos.z + 0.2);
      fov = lerp(37,41,q);
    } else {
      const q = (k-0.5)/0.5;
      _camP.set(lerp(-2.10,-1.55,q), lerp(0.50,1.30,q), lerp(8.3,7.1,q));
      _camL.set(batPos.x+0.52, lerp(1.02,1.24,q), batPos.z-0.05);
      fov = lerp(33,38,q);
    }
  } else if(ph.k === 'flip'){
    /* --- whip around behind him: the far end of the alley is revealed --- */
    const u = clamp((t-ph.t0)/(ph.t1-ph.t0),0,1), k = easeInOut(u);
    const a = lerp(FLIP_A0, FLIP_A1, k);
    // tuck the arc in at the halfway point or it swings through the wall
    const r = lerp(FLIP_R0, FLIP_R1, k) - Math.sin(Math.PI*k)*1.75;
    _camP.set(batPos.x + Math.sin(a)*r, lerp(1.30,1.76,k), batPos.z + Math.cos(a)*r);
    _camL.set(lerp(0.22, 0.10, k), lerp(1.24,1.36,k), lerp(batPos.z-0.05, 6.40, k));
    fov = lerp(38,34,k);
    FX.punch = Math.max(FX.punch, Math.sin(Math.PI*u)*0.22);   // whip smear
  } else if(ph.k === 'face'){
    const k = easeInOut(clamp((t-ph.t0)/(ph.t1-ph.t0),0,1));
    _camP.set(batPos.x + lerp(-1.05,-0.99,k), lerp(1.76,1.745,k), batPos.z + lerp(-2.15,-2.05,k));
    _camL.set(lerp(0.10,0.16,k), lerp(1.36,1.40,k), lerp(6.40,7.10,k));
    fov = lerp(34,33,k);
  } else if(ph.k === 'dlg'){
    if(t < DLG_JOK_T){
      /* over Batman's shoulder while he talks — cape and cowl in frame */
      const k = easeInOut(clamp((t-DLG_BAT_T)/DLG_BAT_D,0,1));
      _camP.set(batPos.x + lerp(-0.99,-0.90,k), lerp(1.745,1.72,k), batPos.z + lerp(-2.05,-1.86,k));
      _camL.set(lerp(0.16,0.18,k), lerp(1.40,1.44,k), lerp(7.10,7.55,k));
      fov = lerp(33,32,k);
    } else if(t < DLG_JOK_T + DLG_JOK_D*0.70){
      /* on the Joker for the pitch */
      const k = easeInOut(clamp((t-DLG_JOK_T)/(DLG_JOK_D*0.70),0,1));
      _camP.set(lerp(0.98,0.74,k), lerp(1.54,1.46,k), lerp(3.25,4.15,k));
      _camL.set(joker.root.position.x, lerp(1.46,1.42,k), joker.root.position.z - 0.05);
      fov = lerp(41,37,k);
    } else {
      /* back to the two-shot for the punchline */
      const k = easeInOut(clamp((t-(DLG_JOK_T+DLG_JOK_D*0.70))/(DLG_JOK_D*0.30),0,1));
      _camP.set(batPos.x + lerp(-1.28,-1.55,k), lerp(1.66,1.80,k), batPos.z + lerp(-2.35,-3.00,k));
      _camL.set(lerp(0.12,0.06,k), lerp(1.40,1.42,k), lerp(6.20,5.90,k));
      fov = lerp(34,37,k);
    }
  } else {
    const k = easeInOut(clamp((t-ph.t0)/(ph.t1-ph.t0),0,1));
    _camP.set(batPos.x + lerp(-1.55,-1.95,k), lerp(1.80,1.92,k), batPos.z + lerp(-3.00,-4.10,k));
    _camL.set(lerp(0.06,0.02,k), lerp(1.42,1.40,k), lerp(5.90,5.60,k));
    fov = lerp(37,39,k);
  }

  camera.position.copy(_camP).add(shake(t*0.9, 0.012));
  if(FX.shake > 0){
    const s = FX.shake;
    camera.position.x += Math.sin(t*97.0)*s*0.55 + Math.sin(t*41.0)*s*0.3;
    camera.position.y += Math.sin(t*83.0+1.3)*s*0.5;
    camera.position.z += Math.sin(t*61.0+2.1)*s*0.35;
  }
  camera.lookAt(_camL);
  camera.rotation.z += Math.sin(t*0.53)*0.004 + (FX.shake>0 ? Math.sin(t*57.0)*FX.shake*0.10 : 0);
  if(Math.abs(camera.fov-fov)>0.001){ camera.fov=fov; camera.updateProjectionMatrix(); }
}

/* ══════════════════════════════════════════════════════════════════════════
   11. animation
   ══════════════════════════════════════════════════════════════════════════ */
const clock  = new THREE.Clock();
const fadeEl = document.getElementById('fade');
const titleEl= document.getElementById('title');
const statsEl= document.getElementById('stats');
let elapsed = 0, frames = 0, fpsAcc = 0, fpsT = 0, degraded = 0;
const neonBase = {a:neonA.intensity};
const lampBase = lamp.intensity, fireBase = fireLight.intensity;

function frame(dtReal){
  syncSize();
  const ts = timeScale();                 // hit-stop / slow-mo on the finishers
  const dt = dtReal * ts;
  elapsed += dt;
  const t = elapsed % LOOP;
  bumpFrame();
  renderer.shadowMap.needsUpdate = ((_frameId & 1) === 0);
  updateFX(dtReal);                       // fx decay runs in real time

  if(ACT === 'city'){
    updateCity(dtReal, elapsed);
    fadeEl.style.opacity = '0';              // the CSS blackout starts opaque
    titleEl.style.opacity = '0';
    grade.uniforms.uTime.value  = elapsed;
    grade.uniforms.uFade.value  = 0;
    grade.uniforms.uPunch.value = FX.punch;
    grade.uniforms.uFlash.value = FX.flash;
    composer.render();
    frames++; fpsAcc += dtReal; fpsT += dtReal;
    if(fpsT > 0.5){ statsEl.textContent = (frames/fpsAcc).toFixed(0)+' FPS'; frames=0; fpsAcc=0; fpsT=0; }
    return;
  }

  /* ---- the sequence: walk in, three fights, walk out ------------------ */
  const st = updateActors(t, Math.max(dt, 1e-5));

  // hero rim/key follow the camera-to-hero axis so he always keeps an edge
  _heroDir.set(batPos.x-camera.position.x, 0, batPos.z-camera.position.z).normalize();
  heroRim.position.set(batPos.x + _heroDir.x*1.25, 2.15, batPos.z + _heroDir.z*1.25);
  heroKey.position.set(batPos.x - _heroDir.x*0.95 - _heroDir.z*0.85, 1.95,
                       batPos.z - _heroDir.z*0.95 + _heroDir.x*0.85);

  /* ---- practical light behaviour ------------------------------------- */
  const flick = (seed, rate, depth)=>{
    const n = Math.sin(elapsed*rate+seed)*0.5 + Math.sin(elapsed*rate*2.7+seed*1.7)*0.3
            + Math.sin(elapsed*rate*7.3+seed*0.5)*0.2;
    return 1 - depth*clamp(0.5+n*0.5,0,1);
  };
  const stutter = (Math.sin(elapsed*11.0)+Math.sin(elapsed*17.3)) > 1.72 ? 0.25 : 1.0;
  const neonF = flick(1.3, 6.0, 0.22) * stutter;
  neonA.intensity = neonBase.a*neonF;
  neonMats.forEach(o=>{
    if(o.m) o.m.emissiveIntensity = o.base*neonF;
    if(o.sprite) o.sprite.material.opacity = o.base*neonF;
  });
  lamp.intensity = lampBase*flick(4.7, 2.3, 0.07);
  if(window.__lampBulb) window.__lampBulb.material.emissiveIntensity = 10*flick(4.7,2.3,0.07);
  if(window.__lampGlow) window.__lampGlow.material.opacity = 0.70*flick(4.7,2.3,0.09);

  const fireF = 0.72 + 0.5*Math.abs(Math.sin(elapsed*5.1)*0.6 + Math.sin(elapsed*8.7)*0.3 + Math.sin(elapsed*13.3)*0.2);
  fireLight.intensity = fireBase*fireF;
  fireLight.position.set(BX + Math.sin(elapsed*6.2)*0.05, 1.02 + Math.sin(elapsed*4.4)*0.05, BZ + Math.cos(elapsed*5.3)*0.05);
  if(window.__fireCore){
    window.__fireCore.material.opacity = 0.50+0.30*fireF;
    window.__fireCore.scale.setScalar(1.15 + fireF*0.45);
  }
  const fl = flick(6.3, 2.0, 0.08);
  lamp2.intensity = 120*fl;
  if(window.__farLamp){ window.__farLamp.mat.emissiveIntensity = 8*fl;
                        window.__farLamp.glow.material.opacity = 0.6*fl; }

  const dl = flick(2.9, 1.7, 0.05);
  doorLamp.intensity = 210*dl;
  if(window.__doorBulb){ window.__doorBulb.mat.emissiveIntensity = 9*dl;
                         window.__doorBulb.glow.material.opacity = 0.6*dl; }

  const sb = window.__swingBulb;
  if(sb){ sb.sw.rotation.z = Math.sin(elapsed*0.9)*0.07; sb.sw.rotation.x = Math.sin(elapsed*0.72+1.2)*0.05;
          const f=flick(9.1,3.1,0.10); sb.pl.intensity=9*f; sb.mat.emissiveIntensity=8*f; }

  /* ---- atmospherics --------------------------------------------------- */
  shafts.forEach(s=>{ s.material.uniforms.uTime.value = elapsed; });
  dust.m.uniforms.uTime.value = elapsed;
  mirror.material.uniforms.uTime.value = elapsed;

  mist.forEach(o=>{
    o.s.position.x += o.vx*dt; o.s.position.y += o.vy*dt;
    o.s.material.rotation += o.vr*dt;
    if(o.s.position.x> 3.6) o.s.position.x=-3.6;
    if(o.s.position.x<-3.6) o.s.position.x= 3.6;
    if(o.s.position.y> 8.5) o.s.position.y= 0.1;
    const dCam = o.s.position.distanceTo(camera.position);
    o.s.material.opacity = o.baseOp*(0.65+0.35*Math.sin(elapsed*0.35+o.ph))*smoothstep(3.6, 10.0, dCam);
  });
  steam.forEach(o=>{
    o.t += dt*o.sp*0.42;
    if(o.t>1){ o.t-=1; o.x=rr(-0.35,0.35); o.z=rr(-0.6,0.6); o.sc=rr(0.7,1.7); }
    const k=o.t;
    o.s.position.set(-1.60+o.x+k*0.35*Math.sin(o.z*6), 0.05+k*3.1, -1.20+o.z+k*0.5);
    o.s.scale.setScalar(o.sc*(0.35+k*2.6));
    o.s.material.opacity = 0.42*Math.sin(Math.PI*clamp(k*1.05,0,1))*(1.0-k*0.35)
                           * smoothstep(1.6, 4.8, o.s.position.distanceTo(camera.position));
    o.s.material.rotation += dt*o.rot;
  });
  fire.forEach(o=>{
    o.t += dt*o.sp*1.5;
    if(o.t>1){ o.t-=1; o.x=rr(-0.16,0.16); o.z=rr(-0.16,0.16); o.sc=rr(0.4,0.85); }
    const k=o.t;
    o.s.position.set(o.x*(1-k*0.5), 0.72+k*1.15, o.z*(1-k*0.5));
    o.s.scale.setScalar(o.sc*(0.75-k*0.42));
    o.s.material.opacity = 0.85*Math.pow(1-k,1.6);
    o.s.material.color.setRGB(1.0, lerp(0.85,0.28,k), lerp(0.45,0.05,k));
  });
  embers.forEach(o=>{
    o.t += dt*o.sp*0.3;
    if(o.t>1){ o.t-=1; o.x=rr(-0.3,0.3); o.z=rr(-0.3,0.3); o.dx=rr(-0.12,0.2); }
    const k=o.t;
    o.s.position.set(BX+o.x+o.dx*k*4.0 + Math.sin(k*9+o.x*10)*0.18, 0.9+k*5.2, BZ+o.z+k*0.9);
    o.s.scale.setScalar(0.055*(1-k*0.5));
    o.s.material.opacity = 0.9*Math.pow(1-k,1.4)*(0.5+0.5*Math.sin(elapsed*9+o.x*20));
  });

  /* ---- camera / DOF ---------------------------------------------------- */
  directCamera(t, st.ph);
  if(st.ph.k === 'fight'){
    const m = fightMid(st.ph.fi, st.ph.z0);
    _tmpV.set(m.x, m.y, m.z);
  } else if(st.ph.k === 'flip' || st.ph.k === 'face' || st.ph.k === 'dlg' || st.ph.k === 'out'){
    _tmpV.set(joker.root.position.x, 1.45, joker.root.position.z);
  } else {
    _tmpV.set(batPos.x, 1.1, batPos.z);
  }
  const focusD = camera.position.distanceTo(_tmpV);
  bokeh.uniforms['focus'].value += (focusD - bokeh.uniforms['focus'].value)*Math.min(1, dtReal*5.0);
  bokeh.uniforms['aperture'].value = 0.0009;
  bloom.strength = 0.46 + FX.bloom;

  /* ---- fades / titles --------------------------------------------------- */
  let fade = 0;
  if(t < 1.25)            fade = 1 - easeOut(t/1.25);
  else if(t > LOOP-1.6)   fade = easeOut((t-(LOOP-1.6))/1.6);
  updateAudio(t, dtReal);
  grade.uniforms.uFade.value  = fade;
  grade.uniforms.uTime.value  = elapsed;
  grade.uniforms.uPunch.value = FX.punch;
  grade.uniforms.uFlash.value = FX.flash;
  fadeEl.style.opacity = '0';
  titleEl.style.opacity = (t>1.5 && t<4.2) ? '0.85' : '0';

  composer.render();

  /* ---- perf guard ------------------------------------------------------- */
  frames++; fpsAcc += dtReal; fpsT += dtReal;
  if(fpsT > 0.5){
    const fps = frames/fpsAcc;
    statsEl.textContent = fps.toFixed(0)+' FPS';
    if(degraded < 2 && fps < 26 && elapsed > 5.0){
      if(degraded === 0){
        renderer.setPixelRatio(1.0); composer.setPixelRatio(1.0);
        curW=0; curH=0; syncSize();
        console.info('[alley] step 1: rendering at 1x');
      } else {
        if(gtao) gtao.enabled = false;
        bokeh.enabled = false;
        console.info('[alley] step 2: SSAO + DOF off');
      }
      degraded++;
    }
    frames=0; fpsAcc=0; fpsT=0;
  }
}
function tick(){ frame(Math.min(clock.getDelta(), 0.05)); requestAnimationFrame(tick); }
window.__step = frame;
window.__seek = (T)=>{ elapsed = Math.max(0, T-0.24); prevBatZ = BAT_Z0;
  for(let i=0;i<8;i++) frame(0.03);
};
/* small console handle for poking at the shot list:
   ALLEY.seek(7.5) jumps to a moment, ALLEY.step(dt) advances one frame */
window.ALLEY = { seek:window.__seek, step:frame, scene, camera, renderer, composer,
                 lights, batman, crooks, THREE };

let curW=0, curH=0;
function applySize(w,h){
  w=Math.max(2,Math.round(w)); h=Math.max(2,Math.round(h));
  if(w===curW && h===curH) return;
  curW=w; curH=h;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  if(typeof cityCam !== 'undefined'){ cityCam.aspect = w/h; cityCam.updateProjectionMatrix(); }
  renderer.setSize(w,h,false);
  composer.setSize(w,h);
}
function syncSize(){
  const el = renderer.domElement;
  const w = el.clientWidth || innerWidth || 1280;
  const h = el.clientHeight || innerHeight || 720;
  applySize(w,h);
}
addEventListener('resize', syncSize);
window.__setSize = applySize;


/* ══════════════════════════════════════════════════════════════════════════
   12. audio — procedural score, the two supplied lines, and ducking
   ══════════════════════════════════════════════════════════════════════════ */
/* The two recordings are embedded as base64 <script type="text/plain"> blocks
   so this stays a single standalone file. Whichever filename contains
   "batman" (case-insensitive) is the first line spoken. */
const PROVIDED_AUDIO = Array.from(document.querySelectorAll('script[data-audio]')).map(el=>({
  name: el.dataset.name || '',
  src : 'data:audio/mpeg;base64,' + el.textContent.trim()
}));
const BATMAN_LINE = PROVIDED_AUDIO.find(f=>/batman/i.test(f.name)) || PROVIDED_AUDIO[0];
const JOKER_LINE  = PROVIDED_AUDIO.find(f=>f !== BATMAN_LINE)      || PROVIDED_AUDIO[1];

const CAPTIONS = {
  batman: "Listen, Joker. I'm done playing your games. I have you cornered. Your going back to a cell, and this time, staying there.",
  joker : "Ohhh Batman! I wanted you to win this time, I promise! But oh what a delicious decision! Take me away, or save those kids from the bomb! Hahaha!"
};

const AUDIO = (function(){
  let ctx=null, master=null, musicBus=null, dlgBus=null, ready=false;
  let muted=false, vol=0.75, duck=1, duckTarget=1;
  let nextStep=0, stepTime=0, intensity=0.25;
  const BPM = 92, STEP = 60/(BPM*4);       // 16th notes
  const el = {};

  function mkEl(spec){
    const a = new Audio(); a.src = spec.src; a.preload='auto'; a.crossOrigin='anonymous';
    return a;
  }
  function build(){
    if(ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = vol; master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.0; musicBus.connect(master);
    dlgBus   = ctx.createGain(); dlgBus.gain.value   = 1.0; dlgBus.connect(master);

    /* ---- sustained bed: detuned saws under a resonant low-pass ----------
       Swap this whole block for a licensed cue if one is available:
       const cue = new Audio('score.mp3'); ctx.createMediaElementSource(cue).connect(musicBus);
    */
    el.droneFilter = ctx.createBiquadFilter();
    el.droneFilter.type='lowpass'; el.droneFilter.frequency.value=210; el.droneFilter.Q.value=7;
    el.droneFilter.connect(musicBus);
    [0, 0.6, -0.55, 12.02].forEach((det,i)=>{
      const o = ctx.createOscillator();
      o.type = i===3 ? 'triangle' : 'sawtooth';
      o.frequency.value = 55.0 * (i===3 ? 2 : 1);
      o.detune.value = det*100*(i===3?0.02:1);
      const g = ctx.createGain(); g.gain.value = i===3 ? 0.07 : 0.16;
      o.connect(g); g.connect(el.droneFilter); o.start();
    });
    // slow swell on the cutoff so the bed breathes
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = ctx.createGain(); lfoG.gain.value = 120;
    lfo.connect(lfoG); lfoG.connect(el.droneFilter.frequency); lfo.start();

    // shared noise buffer for percussion
    const n = ctx.createBuffer(1, ctx.sampleRate*1.2, ctx.sampleRate);
    const nd = n.getChannelData(0);
    for(let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
    el.noise = n;

    // dialogue elements routed through the bus so one control governs everything
    el.bat = mkEl(BATMAN_LINE); el.jok = mkEl(JOKER_LINE);
    const sync = ()=>syncDialogueClock(el.bat.duration, el.jok.duration);
    el.bat.addEventListener('loadedmetadata', sync);
    el.jok.addEventListener('loadedmetadata', sync);
    sync();
    try{
      ctx.createMediaElementSource(el.bat).connect(dlgBus);
      ctx.createMediaElementSource(el.jok).connect(dlgBus);
      el.routed = true;
    }catch(e){ el.routed = false; }
    stepTime = ctx.currentTime + 0.08;
    ready = true;
  }

  function kick(t, gain){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(140,t);
    o.frequency.exponentialRampToValueAtTime(42,t+0.13);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+0.4);
  }
  function hit(t, gain, freq, q, dur){
    const src=ctx.createBufferSource(); src.buffer=el.noise;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(musicBus);
    src.start(t); src.stop(t+dur+0.05);
  }
  function brass(t, gain, freq){
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.Q.value=4;
    f.frequency.setValueAtTime(180,t); f.frequency.linearRampToValueAtTime(1500,t+0.5);
    f.frequency.linearRampToValueAtTime(300,t+2.0);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(gain,t+0.35);
    g.gain.linearRampToValueAtTime(0.0001,t+2.1);
    f.connect(g); g.connect(musicBus);
    [0,7,-6].forEach(d=>{ const o=ctx.createOscillator(); o.type='sawtooth';
      o.frequency.value=freq; o.detune.value=d; o.connect(f); o.start(t); o.stop(t+2.2); });
  }

  function schedule(){
    if(!ready) return;
    const now = ctx.currentTime;
    while(stepTime < now + 0.18){
      const s = nextStep % 16, bar = Math.floor(nextStep/16);
      const I = intensity;
      if(s===0 || s===6 || s===10) kick(stepTime, 0.34 + 0.30*I);
      if(s===8) hit(stepTime, 0.16 + 0.22*I, 1900, 1.2, 0.16);
      if(I>0.45 && (s%2===1)) hit(stepTime, 0.020 + 0.030*I, 7200, 0.9, 0.045);
      if(I>0.62 && (s===3 || s===11)) hit(stepTime, 0.05*I, 320, 2.5, 0.22);
      if(s===0 && bar%4===0) brass(stepTime, 0.045 + 0.075*I, 55 * (bar%8===0 ? 1.5 : 1));
      stepTime += STEP; nextStep++;
    }
  }

  return {
    get ready(){ return ready; },
    start(){
      build();
      if(!ctx) return;
      if(ctx.state === 'suspended') ctx.resume();
      musicBus.gain.cancelScheduledValues(ctx.currentTime);
      musicBus.gain.setValueAtTime(musicBus.gain.value, ctx.currentTime);
      musicBus.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 2.2);
    },
    setIntensity(v){ intensity = clamp(v,0,1);
      if(ready) el.droneFilter.frequency.setTargetAtTime(190 + 520*intensity, ctx.currentTime, 0.6); },
    duckTo(v){ duckTarget = v; },
    tick(dt){
      if(!ready) return;
      duck += (duckTarget - duck) * Math.min(1, dt*(duckTarget < duck ? 3.4 : 1.5));
      musicBus.gain.setTargetAtTime(0.55*duck, ctx.currentTime, 0.08);
      schedule();
    },
    play(which, offset){
      if(!ready) return;
      const a = which==='bat' ? el.bat : el.jok;
      try{ a.currentTime = Math.max(0, offset||0); if(!el.routed) a.volume = muted?0:vol; a.play(); }catch(e){}
    },
    stopLines(){ if(!ready) return; [el.bat, el.jok].forEach(a=>{ try{ a.pause(); a.currentTime=0; }catch(e){} }); },
    setVolume(v){ vol = clamp(v,0,1); if(master) master.gain.setTargetAtTime(muted?0:vol, ctx.currentTime, 0.05);
                  if(ready && !el.routed){ el.bat.volume = muted?0:vol; el.jok.volume = muted?0:vol; } },
    toggleMute(){ muted = !muted; this.setVolume(vol); return muted; },
    get muted(){ return muted; },
    get els(){ return el; },
    get ctx(){ return ctx; },
    get buses(){ return {master, musicBus, dlgBus}; }
  };
})();

if(window.ALLEY) window.ALLEY.audio = AUDIO;

/* ---- caption box ---------------------------------------------------------- */
const capEl  = document.getElementById('cap');
const capWho = capEl.querySelector('.who');
const capTxt = capEl.querySelector('.txt');
let capState = '';
function setCaption(kind){
  if(kind === capState) return;
  capState = kind;
  if(!kind){ capEl.classList.remove('on'); return; }
  const bat = kind === 'batman';
  capEl.style.setProperty('--who', bat ? '#8fa9d6' : '#7fc98d');
  capWho.textContent = bat ? 'Batman' : 'Joker';
  capTxt.textContent = bat ? CAPTIONS.batman : CAPTIONS.joker;
  capEl.classList.add('on');
}

/* ---- dialogue / score cueing off the story clock -------------------------- */
const CUE = { batPlayed:false, jokPlayed:false, lastT:0 };
function updateAudio(t, dtReal){
  // score intensity follows the sequence
  let inten = 0.25;
  if(t > 5.5 && t < 23.0)      inten = 0.55 + 0.45*smoothstep(7.0, 18.0, t);
  else if(t < 5.5)             inten = 0.20 + 0.25*smoothstep(0.0, 5.0, t);
  else if(t < 28.6)            inten = 0.45;
  else if(t < DLG_BAT_T)       inten = 0.30;
  else                         inten = 0.16;
  AUDIO.setIntensity(inten);

  const speaking = (t >= DLG_BAT_T && t < DLG_BAT_T + DLG_BAT_D + 0.25) ||
                   (t >= DLG_JOK_T && t < DLG_JOK_T + DLG_JOK_D + 0.30);
  AUDIO.duckTo(speaking ? 0.22 : 1.0);

  if(t < CUE.lastT){ CUE.batPlayed = CUE.jokPlayed = false; AUDIO.stopLines(); }
  CUE.lastT = t;
  // start each line on its cue; if the clock was scrubbed, join it in progress
  if(!CUE.batPlayed && t >= DLG_BAT_T && t < DLG_BAT_T + DLG_BAT_D){
    CUE.batPlayed = true; AUDIO.play('bat', t - DLG_BAT_T);
  }
  if(!CUE.jokPlayed && t >= DLG_JOK_T && t < DLG_JOK_T + DLG_JOK_D){
    CUE.jokPlayed = true; AUDIO.play('jok', t - DLG_JOK_T);
  }

  // captions: up with the line, down a beat after it ends
  if(t >= DLG_BAT_T - 0.10 && t < DLG_BAT_T + DLG_BAT_D + 0.45)      setCaption('batman');
  else if(t >= DLG_JOK_T - 0.10 && t < DLG_JOK_T + DLG_JOK_D + 0.50) setCaption('joker');
  else setCaption('');

  AUDIO.tick(dtReal);
}

/* ---- controls ------------------------------------------------------------- */
(function wireAudioUI(){
  const startEl = document.getElementById('start');
  const muteBtn = document.getElementById('mute');
  const volEl   = document.getElementById('vol');
  const begin = ()=>{
    startEl.classList.add('gone');
    setTimeout(()=>startEl.remove(), 700);
    AUDIO.start(); AUDIO.setVolume(volEl.value/100);
    elapsed = 0; CUE.batPlayed = CUE.jokPlayed = false; CUE.lastT = 0;
  };
  startEl.addEventListener('click', begin);
  addEventListener('keydown', e=>{ if(e.code==='Space' && startEl.isConnected){ e.preventDefault(); begin(); } });
  muteBtn.addEventListener('click', ()=>{
    const m = AUDIO.toggleMute();
    muteBtn.innerHTML = m ? '&#9776;' : '&#9834;';
    muteBtn.style.color = m ? '#6a7382' : '#c3cede';
  });
  volEl.addEventListener('input', ()=>AUDIO.setVolume(volEl.value/100));
})();


/* ══════════════════════════════════════════════════════════════════════════
   13. GOTHAM — open world, built on the same renderer / composer / materials
   ══════════════════════════════════════════════════════════════════════════ */
const CITY = {
  cols: 20, rows: 20,        // blocks — 1480m across, ~50-60s to cross by swing
  block: 74,                 // block pitch, metres
  street: 18,                // road width; the rest is building lot
  get span(){ return this.cols * this.block; }
};
const CITY_HALF = CITY.span * 0.5;
/* world x/z of a block's centre */
function blockCentre(c, r, out){
  return (out||new THREE.Vector3()).set(
    (c - (CITY.cols-1)/2) * CITY.block, 0,
    (r - (CITY.rows-1)/2) * CITY.block);
}

const cityScene = new THREE.Scene();
const cityCam   = new THREE.PerspectiveCamera(58, (innerWidth||1280)/(innerHeight||720), 0.3, 4200);
cityCam.position.set(0, 62, 210);
cityScene.environment = scene.environment;          // same PMREM as the cutscene
/* fog colour must match the sky's horizon haze — if it's darker, distant
   geometry fades to a black mass instead of dissolving into the skyline */
cityScene.fog = new THREE.FogExp2(0x2f2748, 0.0012);

/* ---- night sky: navy→purple gradient, stars, moon ------------------------ */
const MOON_DIR = new THREE.Vector3(0.34, 0.40, -0.85).normalize();
const citySky = new THREE.Mesh(
  new THREE.SphereGeometry(2600, 40, 26),
  new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{
      top:{value:new THREE.Color(0x141b36)}, mid:{value:new THREE.Color(0x1e2142)},
      low:{value:new THREE.Color(0x2c2449)}, haze:{value:new THREE.Color(0x3d3050)},
      moonDir:{value:MOON_DIR}, uTime:{value:0}
    },
    vertexShader:`varying vec3 vP; void main(){ vP=position;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform vec3 top,mid,low,haze,moonDir; uniform float uTime; varying vec3 vP;
      float h21(vec2 p){ p=fract(p*vec2(443.897,441.423)); p+=dot(p,p+19.19); return fract(p.x*p.y); }
      void main(){
        vec3 d = normalize(vP);
        float h = clamp(d.y*0.5+0.5, 0.0, 1.0);
        /* wide, overlapping bands — a tight transition here reads as a hard
           dome edge ringing the horizon */
        vec3 c = mix(haze, low, smoothstep(0.44,0.64,h));
        c = mix(c, mid, smoothstep(0.52,0.86,h));
        c = mix(c, top, smoothstep(0.66,1.25,h));
        // stars: one small point per cell, thinned toward the lit horizon
        if(d.y > 0.03){
          vec2 uv = d.xz/max(d.y,0.05) * 95.0;
          vec2 g = floor(uv), f = fract(uv);
          float s = h21(g);
          if(s > 0.982){
            vec2 jit = vec2(h21(g+3.17), h21(g+7.71));
            float pt = smoothstep(0.15, 0.02, length(f - jit));
            float tw = 0.6 + 0.4*sin(uTime*1.7 + s*300.0);
            c += vec3(0.82,0.88,1.0) * pt * ((s-0.982)/0.018) * tw
                 * smoothstep(0.05,0.50,d.y) * 0.75;
          }
        }
        // moon: a small hard disc, then halo falloff measured in radians
        float md  = dot(d, normalize(moonDir));
        float ang = acos(clamp(md, -1.0, 1.0));
        float disc = 1.0 - smoothstep(0.0085, 0.0112, ang);
        c = mix(c, vec3(0.94,0.96,1.00)*1.45, disc);
        c += vec3(0.44,0.52,0.74) * (exp(-ang*26.0)*0.30 + exp(-ang*6.0)*0.10);
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
citySky.renderOrder = -100; cityScene.add(citySky);
/* the dome must ride with the camera — anchored at the origin its far side
   falls outside the far plane and gets clipped into a hole */
citySky.matrixAutoUpdate = true;

/* ---- lighting: moon key + sky fill, matching the cutscene's approach ------ */
const moonLight = new THREE.DirectionalLight(0xaebfe8, 1.95);
moonLight.position.copy(MOON_DIR).multiplyScalar(300);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.near = 20; moonLight.shadow.camera.far = 620;
moonLight.shadow.bias = -0.0006; moonLight.shadow.normalBias = 0.06;
moonLight.shadow.radius = 3;
{ const c = moonLight.shadow.camera; c.left=-140; c.right=140; c.top=140; c.bottom=-140; c.updateProjectionMatrix(); }
cityScene.add(moonLight, moonLight.target);

const citySkyFill = new THREE.HemisphereLight(0x33406e, 0x181222, 1.55);
cityScene.add(citySkyFill);
/* sodium bounce off the streets, the classic orange under-light */
const cityBounce = new THREE.DirectionalLight(0xff9a55, 0.09);
cityBounce.position.set(-40, -60, 30);
cityScene.add(cityBounce);
/* light pollution filling the faces the moon never reaches — without this
   half of every building reads as flat black */
const cityGlow = new THREE.DirectionalLight(0xffa468, 0.42);
cityGlow.position.set(-160, 70, 250);
cityScene.add(cityGlow);
const cityGlow2 = new THREE.DirectionalLight(0x6f86c8, 0.30);
cityGlow2.position.set(220, 90, -150);
cityScene.add(cityGlow2);

/* ---- ground: wet asphalt, same material recipe as the alley -------------- */
const groundSet = cloneSet(TEX.asphalt, 290, 290);
const cityGround = new THREE.Mesh(
  new THREE.PlaneGeometry(4200, 4200),
  new THREE.MeshStandardMaterial({
    map:groundSet.map, normalMap:groundSet.normalMap, roughnessMap:groundSet.roughnessMap,
    color:0x8c8c8c, roughness:1.0, metalness:0.05, envMapIntensity:0.55,
    normalScale:new THREE.Vector2(0.75,0.75)
  })
);
cityGround.rotation.x = -Math.PI/2;
cityGround.receiveShadow = true;
cityScene.add(cityGround);

/* ---- puddle mirror that travels with the camera --------------------------
   A city can't afford a mirror the size of the map, so a 70m patch follows the
   player and shows reflections only where the puddle mask says there's water.
   World-space UVs keep the puddles pinned to the ground as the patch moves. */
const PuddleShader = {
  uniforms: Object.assign({}, THREE.UniformsLib.fog, {
    color:{value:null}, tDiffuse:{value:null}, textureMatrix:{value:null},
    uTime:{value:0}, tNoise:{value:null}, tMask:{value:null}, uGain:{value:0.92}
  }),
  vertexShader:`
    uniform mat4 textureMatrix;
    varying vec4 vProj; varying vec3 vWorld; varying vec2 vPatch;
    #include <fog_pars_vertex>
    void main(){
      vPatch = uv;
      vec4 wp = modelMatrix * vec4(position,1.0);
      vWorld = wp.xyz;
      vProj = textureMatrix * vec4(position,1.0);
      vec4 mvPosition = modelViewMatrix * vec4(position,1.0);
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader:`
    uniform vec3 color; uniform sampler2D tDiffuse, tNoise, tMask;
    uniform float uTime, uGain;
    varying vec4 vProj; varying vec3 vWorld; varying vec2 vPatch;
    #include <fog_pars_fragment>
    void main(){
      vec2 wuv = vWorld.xz * 0.2750;
      float m = texture2D(tMask, wuv).r;              // mask: 1 = dry asphalt
      float wet = smoothstep(0.30, 0.0, m);           // keep only the deep spots
      wet *= smoothstep(0.50, 0.34, length(vPatch-0.5));  // hide the patch border
      if(wet < 0.02) discard;
      vec2 n1 = texture2D(tNoise, wuv*1.7 + vec2(uTime*0.010, uTime*0.021)).rg;
      vec2 n2 = texture2D(tNoise, wuv*3.4 - vec2(uTime*0.017, uTime*0.011)).rg;
      vec2 d  = ((n1-0.5)+(n2-0.5));
      vec4 p  = vProj;  p.xy += d * 0.010 * p.w;
      vec3 refl = texture2DProj(tDiffuse, p).rgb;
      refl = min(refl, vec3(1.6));                    // the moon must not blow the street out
      refl = pow(refl, vec3(1.10)) * uGain * color;
      gl_FragColor = vec4(refl, wet);
      #include <fog_fragment>
    }`
};
const puddleMirror = new Reflector(new THREE.PlaneGeometry(70, 70), {
  textureWidth: 512, textureHeight: 512,
  color: 0x9aa6b8, clipBias: 0.006, shader: PuddleShader
});
puddleMirror.material.fog = true;
puddleMirror.material.transparent = true;
puddleMirror.material.depthWrite = false;
puddleMirror.material.uniforms.tNoise.value = TEX.ripple;
puddleMirror.material.uniforms.tMask.value  = groundSet.alphaMap;
puddleMirror.rotation.x = -Math.PI/2;
puddleMirror.position.y = 0.03;
puddleMirror.renderOrder = 2;
cityScene.add(puddleMirror);

/* one mirror update per frame, and only on alternate frames */
const _cityOBR = puddleMirror.onBeforeRender;
let _puddleFrame = -1;
puddleMirror.onBeforeRender = function(r,s,c){
  if(_puddleFrame === _frameId) return;
  _puddleFrame = _frameId;
  if(_frameId & 1) return;
  cityGround.visible = false;
  _cityOBR.call(this,r,s,c);
  cityGround.visible = true;
};

/* ---- road surface grid --------------------------------------------------- */
(function sidewalks(){
  const lot = CITY.block - CITY.street;
  const kerbSet = cloneSet(TEX.concrete, 9, 9);
  const kerbMat = new THREE.MeshStandardMaterial({
    map:kerbSet.map, normalMap:kerbSet.normalMap, roughnessMap:kerbSet.roughnessMap,
    color:0x6e6e6e, roughness:1.0, metalness:0.0, envMapIntensity:0.35
  });
  const geo = new THREE.BoxGeometry(lot, 0.34, lot);
  const im  = new THREE.InstancedMesh(geo, kerbMat, CITY.cols*CITY.rows);
  im.receiveShadow = true; im.castShadow = true;
  const m4 = new THREE.Matrix4(), v = new THREE.Vector3();
  let i = 0;
  for(let c=0;c<CITY.cols;c++) for(let r=0;r<CITY.rows;r++){
    blockCentre(c, r, v);
    im.setMatrixAt(i++, m4.makeTranslation(v.x, 0.17, v.z));
  }
  im.instanceMatrix.needsUpdate = true;
  cityScene.add(im);
})();

(function roads(){
  const roadSet = cloneSet(TEX.asphalt, 4, 60);
  const roadMat = new THREE.MeshStandardMaterial({
    map:roadSet.map, normalMap:roadSet.normalMap, roughnessMap:roadSet.roughnessMap,
    color:0x8f8f8f, roughness:1.0, metalness:0.04, envMapIntensity:0.7,
    polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2
  });
  const L = CITY.span + CITY.block;
  for(let i=0;i<=CITY.cols;i++){
    const x = (i - CITY.cols/2) * CITY.block;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(CITY.street, L), roadMat);
    m.rotation.x = -Math.PI/2; m.position.set(x, 0.012, 0);
    m.receiveShadow = true; cityScene.add(m);
    const n = new THREE.Mesh(new THREE.PlaneGeometry(L, CITY.street), roadMat);
    n.rotation.x = -Math.PI/2; n.position.set(0, 0.014, x);
    n.receiveShadow = true; cityScene.add(n);
  }
})();

/* ---- act switching: one renderer, one composer, two worlds --------------- */
let ACT = 'cutscene';
function setAct(next){
  if(ACT === next) return;
  ACT = next;
  const sc = (next === 'city') ? cityScene : scene;
  const cm = (next === 'city') ? cityCam  : camera;
  renderPass.scene = sc; renderPass.camera = cm;
  bokeh.scene = sc;      bokeh.camera = cm;
  if(gtao){ gtao.scene = sc; gtao.camera = cm; }
  curW = 0; curH = 0; syncSize();          // re-apply aspect to the live camera
  console.info('[gotham] act →', next);
}
function activeCamera(){ return ACT === 'city' ? cityCam : camera; }

/* ---- debug fly camera (stands in until the player controller lands) ------ */
const fly = { yaw: Math.PI, pitch: -0.22, speed: 42, on: false };
const flyKeys = Object.create(null);
addEventListener('keydown', e=>{ flyKeys[e.code] = true;
  if(e.code === 'KeyG'){ setAct(ACT === 'city' ? 'cutscene' : 'city'); }
});
addEventListener('keyup',   e=>{ flyKeys[e.code] = false; });
canvas.addEventListener('mousedown', e=>{ if(ACT==='city') fly.on = true; });
addEventListener('mouseup',   ()=> fly.on = false);
addEventListener('mousemove', e=>{
  if(!fly.on) return;
  fly.yaw   -= e.movementX * 0.0026;
  fly.pitch  = clamp(fly.pitch - e.movementY * 0.0026, -1.45, 1.45);
});
const _flyFwd = new THREE.Vector3(), _flyRight = new THREE.Vector3();
function updateFly(dt){
  _flyFwd.set(Math.sin(fly.yaw)*Math.cos(fly.pitch), Math.sin(fly.pitch), Math.cos(fly.yaw)*Math.cos(fly.pitch));
  _flyRight.set(Math.sin(fly.yaw - Math.PI/2), 0, Math.cos(fly.yaw - Math.PI/2));
  const sp = fly.speed * (flyKeys.ShiftLeft ? 3.2 : 1) * dt;
  if(flyKeys.KeyW) cityCam.position.addScaledVector(_flyFwd, sp);
  if(flyKeys.KeyS) cityCam.position.addScaledVector(_flyFwd, -sp);
  if(flyKeys.KeyD) cityCam.position.addScaledVector(_flyRight, sp);
  if(flyKeys.KeyA) cityCam.position.addScaledVector(_flyRight, -sp);
  if(flyKeys.KeyE || flyKeys.Space)  cityCam.position.y += sp;
  if(flyKeys.KeyQ || flyKeys.ControlLeft) cityCam.position.y -= sp;
  cityCam.position.y = Math.max(1.4, cityCam.position.y);
  cityCam.lookAt(cityCam.position.x + _flyFwd.x, cityCam.position.y + _flyFwd.y, cityCam.position.z + _flyFwd.z);
}

/* ---- per-frame city update ----------------------------------------------- */
function updateCity(dt, t){
  updateFly(dt);
  citySky.position.copy(cityCam.position);
  citySky.material.uniforms.uTime.value = t;
  cityBeacons.forEach(b=>{
    const k = (Math.sin(t*2.0 + b.ph*Math.PI) > 0.55) ? 1 : 0.05;
    b.mat.emissiveIntensity = 5*k;
  });
  puddleMirror.material.uniforms.uTime.value = t;
  // mirror patch and shadow volume travel with the viewer
  puddleMirror.position.x = cityCam.position.x;
  puddleMirror.position.z = cityCam.position.z;
  moonLight.target.position.set(cityCam.position.x, 0, cityCam.position.z);
  moonLight.position.set(cityCam.position.x + MOON_DIR.x*300,
                         MOON_DIR.y*300,
                         cityCam.position.z + MOON_DIR.z*300);
  moonLight.target.updateMatrixWorld();
  // keep DOF sane outdoors — long focus, almost everything crisp
  bokeh.uniforms['focus'].value += (46 - bokeh.uniforms['focus'].value) * Math.min(1, dt*3);
  bokeh.uniforms['aperture'].value = 0.00016;
}


/* ══════════════════════════════════════════════════════════════════════════
   14. skyline — facade textures, building masses, roof furniture
   ══════════════════════════════════════════════════════════════════════════ */
/* Windows are baked into the facade texture rather than built as geometry:
   at 169 blocks that is the difference between ~12 draw calls and ~40,000.
   Each variant carries its own emissive map, so the lit-window pattern is
   randomised per texture and then per building by UV offset. */
const FACADE_TILE_W = 12.8, FACADE_TILE_H = 18.0;   // metres covered by one tile
const FACADE_COLS = 4, FACADE_ROWS = 5;

function makeFacade(opts){
  const W = 384, H = 540;
  const cw = W/FACADE_COLS, ch = H/FACADE_ROWS;
  const alb = cv(W,H), emi = cv(W,H), rgh = cv(W,H), hgt = cv(W,H);
  const a = alb.getContext('2d',{willReadFrequently:true});
  const e = emi.getContext('2d',{willReadFrequently:true});
  const r = rgh.getContext('2d',{willReadFrequently:true});
  const h = hgt.getContext('2d',{willReadFrequently:true});

  a.fillStyle = opts.wall;   a.fillRect(0,0,W,H);
  e.fillStyle = '#000000';   e.fillRect(0,0,W,H);
  r.fillStyle = opts.rough;  r.fillRect(0,0,W,H);
  h.fillStyle = '#8a8a8a';   h.fillRect(0,0,W,H);

  // masonry courses / spandrel bands between floors
  for(let row=0; row<FACADE_ROWS; row++){
    const y = row*ch;
    a.fillStyle = opts.band; a.fillRect(0, y+ch-7, W, 7);
    h.fillStyle = '#c8c8c8'; h.fillRect(0, y+ch-7, W, 7);
    r.fillStyle = '#c0c0c0'; r.fillRect(0, y+ch-7, W, 7);
    if(opts.pilaster){
      for(let col=0; col<=FACADE_COLS; col++){
        const x = col*cw - 3;
        a.fillStyle = opts.band; a.fillRect(x, y, 6, ch);
        h.fillStyle = '#b4b4b4'; h.fillRect(x, y, 6, ch);
      }
    }
  }
  // continuous horizontal glazing for the modern towers
  if(opts.ribbon){
    for(let row=0; row<FACADE_ROWS; row++){
      const y = row*ch + ch*0.16, hh = ch*0.58;
      a.fillStyle = '#0b1218'; a.fillRect(0, y, W, hh);
      h.fillStyle = '#4a4a4a'; h.fillRect(0, y, W, hh);
      r.fillStyle = '#2c2c2c'; r.fillRect(0, y, W, hh);
      for(let col=0; col<FACADE_COLS*2; col++){
        const x = col*(W/(FACADE_COLS*2));
        a.fillStyle = opts.frame; a.fillRect(x, y, 2, hh);
        if(rand() < opts.litChance){
          const dim = 0.3 + rand()*0.6;
          e.globalAlpha = dim; e.fillStyle = rand()<0.5 ? '#cfe0ff' : '#ffd8a4';
          e.fillRect(x+2, y+2, W/(FACADE_COLS*2)-4, hh-4);
          e.globalAlpha = 1;
        }
      }
    }
  }
  // windows: recessed, most dark, a scattered few lit
  const warm = ['#ffcf8e','#ffbe6a','#ffd9a8','#ffae55'];
  const cool = ['#bcd6ff','#a8c4f0','#d4e4ff'];
  for(let row=0; row<FACADE_ROWS && !opts.ribbon; row++){
    for(let col=0; col<FACADE_COLS; col++){
      const x = col*cw + cw*0.22, y = row*ch + ch*0.20;
      const w = cw*0.56, hh = ch*0.52;
      a.fillStyle = '#0a0c12'; a.fillRect(x, y, w, hh);          // dark glass
      h.fillStyle = '#3a3a3a'; h.fillRect(x, y, w, hh);          // recessed
      r.fillStyle = '#3a3a3a'; r.fillRect(x, y, w, hh);          // glossy
      a.fillStyle = opts.frame;                                   // frame
      a.fillRect(x-2, y-2, w+4, 3); a.fillRect(x-2, y+hh-1, w+4, 3);
      a.fillRect(x-2, y, 3, hh);    a.fillRect(x+w-1, y, 3, hh);
      const mull = Math.floor(x + w*0.5);
      a.fillStyle = opts.frame; a.fillRect(mull, y, 2, hh);
      if(rand() < opts.litChance){
        const warmLit = rand() < 0.82;
        const col2 = warmLit ? warm[(rand()*warm.length)|0] : cool[(rand()*cool.length)|0];
        const dim = 0.35 + rand()*0.65;
        e.globalAlpha = dim; e.fillStyle = col2; e.fillRect(x, y, w, hh);
        // blinds / occupants: knock out part of the pane so it isn't a flat slab
        e.globalAlpha = dim*0.55; e.fillStyle = '#000';
        if(rand()<0.5) e.fillRect(x, y, w, hh*(0.2+rand()*0.4));
        if(rand()<0.3) e.fillRect(x+w*rand()*0.6, y, w*0.22, hh);
        e.globalAlpha = 1;
        a.fillStyle = 'rgba(70,60,45,0.55)'; a.fillRect(x, y, w, hh);
      }
    }
  }
  // soot: vertical streaks and a grimy base, drawn rather than noised (fast)
  a.globalAlpha = 0.16; a.fillStyle = '#05060a';
  for(let i=0;i<46;i++){
    const x = rand()*W, w = 2 + rand()*13, y = rand()*H*0.7;
    a.fillRect(x, y, w, H-y);
  }
  a.globalAlpha = 1;
  const gd = a.createLinearGradient(0,H,0,H*0.55);
  gd.addColorStop(0,'rgba(4,5,9,0.55)'); gd.addColorStop(1,'rgba(4,5,9,0)');
  a.fillStyle = gd; a.fillRect(0,H*0.55,W,H*0.45);

  const t = (canv, srgb)=>{ const tx = texFrom(canv, 1, 1, srgb); tx.anisotropy = 8; return tx; };
  return {
    map: t(alb, true), emissiveMap: t(emi, true), roughnessMap: t(rgh),
    normalMap: t(normalMapFrom(hgt, 1.5))
  };
}

const FACADE_STYLES = [
  {wall:'#4d3d34', band:'#2b211d', frame:'#141117', rough:'#e2e2e2', litChance:0.17, pilaster:true },
  {wall:'#3b3d46', band:'#232429', frame:'#101013', rough:'#d6d6d6', litChance:0.13, pilaster:false},
  {wall:'#443845', band:'#241d24', frame:'#0e0d11', rough:'#dedede', litChance:0.21, pilaster:true },
  {wall:'#33363b', band:'#1b1d20', frame:'#0c0c0f', rough:'#cacaca', litChance:0.09, pilaster:false},
  {wall:'#544137', band:'#2f241e', frame:'#15110f', rough:'#e6e6e6', litChance:0.24, pilaster:true },
  {wall:'#2e3138', band:'#191a1f', frame:'#0b0b0e', rough:'#c2c2c2', litChance:0.06, pilaster:false},
  // 6,7 — modern glass: ribbon glazing, cool and reflective
  {wall:'#1f2a33', band:'#18212a', frame:'#0d141a', rough:'#5a5a5a', litChance:0.30, pilaster:false, ribbon:true},
  {wall:'#232b30', band:'#1a2126', frame:'#101519', rough:'#4e4e4e', litChance:0.22, pilaster:false, ribbon:true},
  // 8,9 — pale limestone / grey concrete
  {wall:'#6d6a63', band:'#5a574f', frame:'#2a2823', rough:'#eaeaea', litChance:0.11, pilaster:true },
  {wall:'#5c5f66', band:'#4a4d53', frame:'#232529', rough:'#e0e0e0', litChance:0.08, pilaster:true }
];
const facadeMats = FACADE_STYLES.map(st=>{
  const f = makeFacade(st);
  return new THREE.MeshStandardMaterial({
    map:f.map, emissiveMap:f.emissiveMap, roughnessMap:f.roughnessMap, normalMap:f.normalMap,
    emissive:0xffffff, emissiveIntensity:2.30,
    color:0xffffff, roughness:1.0, metalness: st.ribbon ? 0.55 : 0.02,
    envMapIntensity: st.ribbon ? 1.5 : 0.80,
    normalScale:new THREE.Vector2(0.7,0.7)
  });
});
/* glowing setback bands on the crowned towers */
const crownMat = new THREE.MeshStandardMaterial({
  color:0x121016, emissive:0xffc27a, emissiveIntensity:0.95, roughness:0.5, metalness:0.1
});
const trimMat = new THREE.MeshStandardMaterial({
  color:0x4a4a4e, roughness:0.92, metalness:0.03, envMapIntensity:0.35,
  map:cloneSet(TEX.concrete, 3, 3).map
});
const roofMat = new THREE.MeshStandardMaterial({
  color:0x2c2f34, roughness:0.95, metalness:0.05, envMapIntensity:0.3
});

/* box with UVs scaled to real metres, so one texture tile is always 12.8×18m */
function facadeBox(w, hgt, d){
  const g = new THREE.BoxGeometry(w, hgt, d);
  const uv = g.attributes.uv;
  const su = [d, d, w, w, w, w], sv = [hgt, hgt, d, d, hgt, hgt];
  for(let f=0; f<6; f++){
    const U = su[f]/FACADE_TILE_W, V = sv[f]/FACADE_TILE_H;
    for(let i=0;i<4;i++){
      const k = f*4+i;
      uv.setXY(k, uv.getX(k)*U, uv.getY(k)*V);
    }
  }
  return g;
}

/* ---- roof furniture, all instanced --------------------------------------- */
function waterTowerGeo(){
  const parts = [];
  const barrel = new THREE.CylinderGeometry(1.5, 1.6, 3.0, 12); barrel.translate(0, 4.2, 0);
  const roof   = new THREE.ConeGeometry(1.85, 1.1, 12);         roof.translate(0, 6.25, 0);
  parts.push(barrel, roof);
  for(let i=0;i<4;i++){
    const a = i/4*Math.PI*2 + 0.78;
    const leg = new THREE.BoxGeometry(0.16, 2.8, 0.16);
    leg.translate(Math.cos(a)*1.25, 1.4, Math.sin(a)*1.25);
    parts.push(leg);
  }
  const band = new THREE.TorusGeometry(1.56, 0.07, 5, 12); band.rotateX(Math.PI/2); band.translate(0,4.6,0);
  parts.push(band);
  return mergeGeometries(parts);
}
function gargoyleGeo(){
  const parts = [];
  const body = new THREE.BoxGeometry(0.42, 0.52, 0.95); body.rotateX(-0.30); body.translate(0, 0.42, 0.14);
  const head = new THREE.BoxGeometry(0.34, 0.30, 0.40); head.translate(0, 0.66, 0.52);
  const jaw  = new THREE.BoxGeometry(0.22, 0.14, 0.30); jaw.translate(0, 0.54, 0.66);
  parts.push(body, head, jaw);
  for(const s of [-1,1]){
    const wing = new THREE.BoxGeometry(0.10, 0.72, 0.50);
    wing.rotateZ(s*0.42); wing.rotateY(s*0.30);
    wing.translate(s*0.30, 0.72, -0.06);
    parts.push(wing);
    const horn = new THREE.ConeGeometry(0.06, 0.20, 5);
    horn.rotateX(-0.4); horn.translate(s*0.10, 0.82, 0.44);
    parts.push(horn);
  }
  const plinth = new THREE.BoxGeometry(0.62, 0.18, 0.62); plinth.translate(0, 0.09, 0);
  parts.push(plinth);
  return mergeGeometries(parts);
}
function acUnitGeo(){
  const parts = [];
  const box = new THREE.BoxGeometry(1.5, 0.95, 1.5); box.translate(0,0.48,0);
  const fan = new THREE.CylinderGeometry(0.5, 0.5, 0.12, 12); fan.translate(0,1.0,0);
  parts.push(box, fan);
  return mergeGeometries(parts);
}
const GEO_WATER = waterTowerGeo(), GEO_GARG = gargoyleGeo(), GEO_AC = acUnitGeo();
const GEO_MAST  = new THREE.CylinderGeometry(0.10, 0.16, 1, 6);

const stoneMat = new THREE.MeshStandardMaterial({
  color:0x53555a, roughness:0.9, metalness:0.02, envMapIntensity:0.4,
  map:cloneSet(TEX.concrete, 1, 1).map, normalMap:cloneSet(TEX.concrete,1,1).normalMap
});
const rigMat = new THREE.MeshStandardMaterial({ color:0x2a2d31, roughness:0.55, metalness:0.85, envMapIntensity:0.9 });

/* ---- the generator -------------------------------------------------------- */
let cityBeacons = [];
const cityColliders = [];        // {x,z,hw,hd,top} — collision + grapple targets
const cityRoofs     = [];        // {x,y,z} rooftop centres, for spawn/anchor picking
const RESERVED = { hall:{c:9,r:8}, court:{c:4,r:15} };
const LANDMARKS = [ {c:10,r:10,h:300}, {c: 8,r:11,h:246}, {c:12,r: 9,h:262},
                    {c:11,r: 7,h:228}, {c: 7,r: 8,h:238}, {c:13,r:12,h:214},
                    {c: 5,r: 5,h:206}, {c:15,r:14,h:222}, {c:14,r: 5,h:198} ];

/* round / octagonal tower with UVs scaled to real metres */
function facadeCyl(rTop, rBot, h, seg){
  const g = new THREE.CylinderGeometry(rTop, rBot, h, seg, 1, true);
  const uv = g.attributes.uv, circ = Math.PI*2*(rTop+rBot)*0.5;
  for(let i=0;i<uv.count;i++)
    uv.setXY(i, uv.getX(i)*circ/FACADE_TILE_W, uv.getY(i)*h/FACADE_TILE_H);
  return g;
}

(function buildSkyline(){
  const buckets = FACADE_STYLES.map(()=>[]);
  const trims = [], roofs = [], crowns = [];
  const xf = { water:[], garg:[], ac:[], mast:[] };
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(),
        P = new THREE.Vector3(), S = new THREE.Vector3(1,1,1);
  const ctr = new THREE.Vector3();
  const lot = CITY.block - CITY.street;
  const GLASS = [6,7], GREY = [8,9];      // indices into FACADE_STYLES

  function cap(x, z, w, d, h, opts){
    opts = opts || {};
    if(!opts.noCornice){
      const c = new THREE.BoxGeometry(w+1.1, 0.9, d+1.1); c.translate(x, h+0.32, z);
      trims.push(c);
    }
    const rf = new THREE.BoxGeometry(w, 0.3, d); rf.translate(x, h+0.78, z); roofs.push(rf);
    for(const [ox,oz,pw,pd] of [[0,d/2,w+1.1,0.5],[0,-d/2,w+1.1,0.5],[w/2,0,0.5,d+1.1],[-w/2,0,0.5,d+1.1]]){
      const pp = new THREE.BoxGeometry(pw, 1.2, pd); pp.translate(x+ox, h+1.4, z+oz); trims.push(pp);
    }
    cityColliders.push({x, z, hw:w*0.5, hd:d*0.5, top:h+0.95});
    cityRoofs.push({x, y:h+0.95, z, w, d});
    if(h > 45 && rand() < 0.55){
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
        if(rand() < 0.35) continue;
        P.set(x + sx*(w*0.5-0.4), h+0.66, z + sz*(d*0.5-0.4));
        Q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.atan2(sx, sz));
        xf.garg.push(M.compose(P, Q, S).clone());
      }
    }
    return h+0.95;
  }
  function addMass(x, z, w, d, h, variant){
    const g = facadeBox(w, h, d); g.translate(x, h*0.5, z);
    buckets[variant].push(g);
    return cap(x, z, w, d, h);
  }
  function dressRoof(x, z, w, d, top){
    const n = 1 + ((rand()*3)|0);
    for(let i=0;i<n;i++){
      P.set(x + rr(-w*0.32, w*0.32), top, z + rr(-d*0.32, d*0.32));
      Q.setFromAxisAngle(new THREE.Vector3(0,1,0), rand()*6.28);
      xf.ac.push(M.compose(P, Q, S).clone());
    }
    if(Math.min(w,d) > 14 && rand() < 0.45){
      P.set(x + rr(-w*0.26, w*0.26), top, z + rr(-d*0.26, d*0.26));
      Q.setFromAxisAngle(new THREE.Vector3(0,1,0), rand()*6.28);
      xf.water.push(M.compose(P, Q, S).clone());
    }
    if(rand() < 0.34){
      const mh = rr(5, 16);
      P.set(x + rr(-w*0.3, w*0.3), top + mh*0.5, z + rr(-d*0.3, d*0.3));
      xf.mast.push({m: M.compose(P, Q.identity(), S.set(1, mh, 1)).clone(), tip: top+mh, x:P.x, z:P.z});
      S.set(1,1,1);
    }
  }
  /* a glowing setback band — the Chrysler/Empire silhouette cue */
  function crownBand(x, z, w, d, y, th){
    for(const [ox,oz,pw,pd] of [[0,d/2,w,0.6],[0,-d/2,w,0.6],[w/2,0,0.6,d],[-w/2,0,0.6,d]]){
      const b = new THREE.BoxGeometry(pw, th, pd); b.translate(x+ox, y, z+oz); crowns.push(b);
    }
  }

  for(let c=0;c<CITY.cols;c++) for(let r=0;r<CITY.rows;r++){
    if((c===RESERVED.hall.c && r===RESERVED.hall.r) ||
       (c===RESERVED.court.c && r===RESERVED.court.r)) continue;
    blockCentre(c, r, ctr);
    const lm = LANDMARKS.find(L=>L.c===c && L.r===r);
    const dist = Math.hypot(c-(CITY.cols-1)/2, r-(CITY.rows-1)/2) / (CITY.cols*0.5);
    const core = clamp(1 - dist*0.95, 0, 1);
    /* every other block is guaranteed a tall mass, so there is always another
       roof inside grapple range to chain to */
    const spine = ((c + r) % 2) === 0;
    let baseH = lerp(40, 100, core) * (0.78 + rand()*0.75);
    if(spine) baseH = Math.max(baseH, lerp(92, 150, core));

    if(lm){
      let w = lot*0.56, d = lot*0.56, y = 0;
      const variant = rand()<0.4 ? GLASS[(rand()*2)|0] : (rand()*6)|0;
      for(let sN=0; sN<4; sN++){
        const sh = lm.h * (sN===0 ? 0.44 : 0.20);
        const g = facadeBox(w, sh, d); g.translate(ctr.x, y+sh*0.5, ctr.z);
        buckets[variant].push(g);
        const cr = new THREE.BoxGeometry(w+1.4, 1.1, d+1.4); cr.translate(ctr.x, y+sh+0.4, ctr.z);
        trims.push(cr);
        if(sN >= 1) crownBand(ctr.x, ctr.z, w+1.5, d+1.5, y+sh+1.3, 0.34);
        cityColliders.push({x:ctr.x, z:ctr.z, hw:w*0.5, hd:d*0.5, top:y+sh+0.95});
        y += sh; w *= 0.76; d *= 0.76;
      }
      cityRoofs.push({x:ctr.x, y:y+0.95, z:ctr.z, w, d});
      const spire = new THREE.CylinderGeometry(0.3, 2.0, 34, 8);
      spire.translate(ctr.x, y+17, ctr.z); trims.push(spire);
      xf.mast.push({m:new THREE.Matrix4().compose(new THREE.Vector3(ctr.x, y+34+7, ctr.z),
        new THREE.Quaternion(), new THREE.Vector3(1.5, 14, 1.5)), tip:y+48, x:ctr.x, z:ctr.z});
      dressRoof(ctr.x, ctr.z, w, d, y+0.95);
      continue;
    }

    if(rand() < 0.05) continue;                    // plaza / future ground lot

    const roll = rand();
    if(roll < 0.13){
      /* ---- UNIQUE: glass tower, tapered, cool and reflective ---- */
      const w = lot*rr(0.44,0.58), d = lot*rr(0.44,0.58);
      const h = baseH*rr(1.35,2.0);
      const variant = GLASS[(rand()*2)|0];
      const g = facadeBox(w, h, d); g.translate(ctr.x, h*0.5, ctr.z);
      buckets[variant].push(g);
      const tw = w*0.66, td = d*0.66, th = h*0.20;
      const g2 = facadeBox(tw, th, td); g2.translate(ctr.x, h+th*0.5, ctr.z);
      buckets[variant].push(g2);
      crownBand(ctr.x, ctr.z, tw+0.8, td+0.8, h+th-1.2, 0.40);
      const top = cap(ctr.x, ctr.z, tw, td, h+th, {});
      cityColliders.push({x:ctr.x, z:ctr.z, hw:w*0.5, hd:d*0.5, top:h});
      dressRoof(ctr.x, ctr.z, tw, td, top);
    } else if(roll < 0.20){
      /* ---- UNIQUE: round or octagonal tower ---- */
      const seg = rand()<0.5 ? 24 : 8;
      const rad = lot*rr(0.24,0.32), h = baseH*rr(1.2,1.8);
      const variant = rand()<0.5 ? GREY[(rand()*2)|0] : (rand()*6)|0;
      const g = facadeCyl(rad*0.88, rad, h, seg); g.translate(ctr.x, h*0.5, ctr.z);
      buckets[variant].push(g);
      const ring = new THREE.CylinderGeometry(rad*1.06, rad*1.06, 1.0, seg);
      ring.translate(ctr.x, h+0.4, ctr.z); trims.push(ring);
      const disc = new THREE.CylinderGeometry(rad*0.9, rad*0.9, 0.3, seg);
      disc.translate(ctr.x, h+0.9, ctr.z); roofs.push(disc);
      cityColliders.push({x:ctr.x, z:ctr.z, hw:rad*0.92, hd:rad*0.92, top:h+0.95});
      cityRoofs.push({x:ctr.x, y:h+0.95, z:ctr.z, w:rad*1.4, d:rad*1.4});
      dressRoof(ctr.x, ctr.z, rad*1.3, rad*1.3, h+0.95);
    } else if(roll < 0.27){
      /* ---- UNIQUE: gothic twin-spire hall, pale stone ---- */
      const w = lot*rr(0.58,0.74), d = lot*rr(0.46,0.60);
      const h = baseH*rr(0.85,1.20);
      const variant = GREY[(rand()*2)|0];
      const g = facadeBox(w, h, d); g.translate(ctr.x, h*0.5, ctr.z);
      buckets[variant].push(g);
      const top = cap(ctr.x, ctr.z, w, d, h);
      for(const sx of [-1,1]){
        const tw = w*0.20, tt = h*rr(0.30,0.46);
        const t = facadeBox(tw, tt, tw); t.translate(ctr.x + sx*(w*0.5 - tw*0.6), h+tt*0.5, ctr.z);
        buckets[variant].push(t);
        const sp = new THREE.ConeGeometry(tw*0.75, tt*0.55, 6);
        sp.translate(ctr.x + sx*(w*0.5 - tw*0.6), h+tt+tt*0.27, ctr.z); trims.push(sp);
        cityColliders.push({x:ctr.x + sx*(w*0.5 - tw*0.6), z:ctr.z, hw:tw*0.5, hd:tw*0.5, top:h+tt});
      }
      dressRoof(ctr.x, ctr.z, w*0.6, d, top);
    } else if(roll < 0.52){
      /* two masses with an alley between them */
      const split = rr(0.40, 0.60);
      const gap = rr(3.5, 7.0);
      const w1 = lot*split - gap*0.5, w2 = lot*(1-split) - gap*0.5, dd = lot*rr(0.62,0.86);
      const x1 = ctr.x - lot*0.5 + w1*0.5, x2 = ctr.x + lot*0.5 - w2*0.5;
      const variant = (rand()*6)|0;
      const t1 = addMass(x1, ctr.z, w1, dd, baseH*rr(0.80,1.20), variant);
      const t2 = addMass(x2, ctr.z, w2, dd, baseH*rr(0.70,1.30), (variant+3)%6);
      dressRoof(x1, ctr.z, w1, dd, t1); dressRoof(x2, ctr.z, w2, dd, t2);
    } else if(roll < 0.72){
      /* stepped art-deco */
      let w = lot*rr(0.56,0.76), d = lot*rr(0.56,0.76), y = 0;
      const steps = 2 + ((rand()*2)|0), H = baseH*rr(1.20,1.75);
      const variant = (rand()*6)|0;
      for(let sN=0; sN<steps; sN++){
        const sh = H*(sN===0 ? 0.55 : 0.45/(steps-1));
        const g = facadeBox(w, sh, d); g.translate(ctr.x, y+sh*0.5, ctr.z);
        buckets[variant].push(g);
        const cr = new THREE.BoxGeometry(w+1.1, 0.95, d+1.1); cr.translate(ctr.x, y+sh+0.34, ctr.z);
        trims.push(cr);
        cityColliders.push({x:ctr.x, z:ctr.z, hw:w*0.5, hd:d*0.5, top:y+sh+0.95});
        y += sh; w *= rr(0.68,0.80); d *= rr(0.68,0.80);
      }
      cityRoofs.push({x:ctr.x, y:y+0.95, z:ctr.z, w, d});
      dressRoof(ctr.x, ctr.z, w, d, y+0.95);
    } else {
      /* plain slab, set inside the lot so the street has breathing room */
      const w = lot*rr(0.58,0.80), d = lot*rr(0.58,0.80);
      const top = addMass(ctr.x, ctr.z, w, d, baseH*rr(0.90,1.30), (rand()*6)|0);
      dressRoof(ctr.x, ctr.z, w, d, top);
    }
  }

  /* ---- merge and add ---- */
  buckets.forEach((gs, i)=>{
    if(!gs.length) return;
    const m = new THREE.Mesh(mergeGeometries(gs), facadeMats[i]);
    m.castShadow = true; m.receiveShadow = true; cityScene.add(m);
  });
  if(trims.length){
    const m = new THREE.Mesh(mergeGeometries(trims), trimMat);
    m.castShadow = true; m.receiveShadow = true; cityScene.add(m);
  }
  if(roofs.length){
    const m = new THREE.Mesh(mergeGeometries(roofs), roofMat);
    m.receiveShadow = true; cityScene.add(m);
  }
  if(crowns.length){
    const m = new THREE.Mesh(mergeGeometries(crowns), crownMat);
    cityScene.add(m);
  }
  const inst = (geo, mat, list, shadow)=>{
    if(!list.length) return null;
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    list.forEach((m4,i)=>im.setMatrixAt(i, m4));
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = !!shadow; im.receiveShadow = true;
    cityScene.add(im); return im;
  };
  inst(GEO_WATER, rigMat,  xf.water, true);
  inst(GEO_GARG,  stoneMat, xf.garg, true);
  inst(GEO_AC,    rigMat,  xf.ac,    true);
  inst(GEO_MAST,  rigMat,  xf.mast.map(o=>o.m), false);

  const beaconGeo = new THREE.SphereGeometry(0.36, 8, 6);
  const phases = [0, 0.66, 1.33].map(ph=>({
    ph, mat:new THREE.MeshStandardMaterial({ color:0x180205, emissive:0xff2a18,
      emissiveIntensity:5, roughness:0.4 })
  }));
  const groups = [[],[],[]];
  xf.mast.forEach((o,i)=>groups[i%3].push(new THREE.Matrix4().makeTranslation(o.x, o.tip+0.3, o.z)));
  cityBeacons = groups.map((list,i)=>{
    const im = inst(beaconGeo, phases[i].mat, list, false);
    return im ? {im, mat:phases[i].mat, ph:phases[i].ph} : null;
  }).filter(Boolean);

  /* ---- distant skyline beyond the playable grid ---- */
  (function outerCity(){
    const far = [];
    const inner = CITY.span*0.5 + CITY.block;
    for(let i=0;i<520;i++){
      const a2 = rand()*Math.PI*2;
      const rad = inner + 60 + Math.pow(rand(), 0.7) * 900;
      const x = Math.cos(a2)*rad, z = Math.sin(a2)*rad;
      const w = rr(22, 52), d = rr(22, 52);
      const hh = rr(40, 115) + (rand()<0.08 ? rr(80,170) : 0);
      const g = facadeBox(w, hh, d); g.translate(x, hh*0.5, z);
      far.push(g);
    }
    const m = new THREE.Mesh(mergeGeometries(far), facadeMats[1]);
    m.castShadow = false; m.receiveShadow = false; cityScene.add(m);
  })();

  const tall = cityRoofs.filter(o=>o.y > 90).length;
  console.info('[gotham]', CITY.cols+'x'+CITY.rows, 'blocks,', CITY.span+'m span,',
    cityColliders.length, 'masses,', tall, 'roofs above 90m');
})();

window.GOTHAM = {
  get act(){ return ACT; }, setAct:(a)=>setAct(a),
  scene:()=>cityScene, cam:()=>cityCam, CITY,
  roofs:()=>cityRoofs, colliders:()=>cityColliders,
  view(p, look){ cityCam.position.set(p[0],p[1],p[2]);
    if(look){ const d=new THREE.Vector3(look[0]-p[0],look[1]-p[1],look[2]-p[2]).normalize();
      fly.yaw = Math.atan2(d.x, d.z); fly.pitch = Math.asin(clamp(d.y,-1,1)); }
    updateFly(0); }
};

/* warm up shaders, then start */
if(new URLSearchParams(location.search).get('act') === 'city'){
  setAct('city');
  const st = document.getElementById('start'); if(st) st.remove();
}
renderer.compile(scene, camera);
renderer.compile(cityScene, cityCam);
composer.render();
console.info('[alley] scene built in ' + (performance.now()-T_BOOT).toFixed(0) + ' ms');
document.getElementById('loader').classList.add('done');
setTimeout(()=>document.getElementById('loader').remove(), 900);
clock.start();
tick();

window.addEventListener('error', e=>{
  const el=document.getElementById('err');
  el.style.display='block';
  el.textContent = 'Runtime error:\n' + (e.error && e.error.stack || e.message);
});
</script>
